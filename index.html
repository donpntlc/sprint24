/* ---------------- Stufen: lesen -> schreiben -> sprechen ---------------- */
function stageOf(c){
  if(!istSpr() || c.scn==="w") return "lesen";
  const b=S.box[c.id]||0;
  if(b<2) return "lesen";
  if(b<4) return "schreiben";
  return micOK() ? "sprechen" : "schreiben";
}
const STAGE_T={lesen:"Stufe 1 \u00b7 lesen", schreiben:"Stufe 2 \u00b7 schreiben", sprechen:"Stufe 3 \u00b7 sprechen"};

/* ---------------- Standortbestimmung + Abschlusstest ---------------- */
function testSet(){ return CHUNKS.filter((_,i)=>i%Math.max(1,Math.round(CHUNKS.length/20))===0).slice(0,20); }
let T=null;
function preR(){ return (S.preBy||{})[S.rubrik]; }
function istSpr(){ const r=RUBRIKEN.find(x=>x.id===S.rubrik); return !!(r&&(r.g==="Sprachen"||r.g==="Sprachen der Schrift")); }
function kurzSpr(){ return S.rubrik.toUpperCase(); }
function dirLbl(d){ return istSpr() ? (d==="de"?"DE \u2192 "+kurzSpr():d==="pt"?kurzSpr()+" \u2192 DE":"gemischt") : (d==="de"?"Frage \u2192 Antwort":d==="pt"?"Antwort \u2192 Frage":"gemischt"); }
function dirNote(d){ return istSpr()
  ? (d==="de"?"Du produzierst \u2014 das trainiert Sprechen.":d==="pt"?"Du verstehst \u2014 das trainiert H\u00f6ren und Lesen.":"Beides gemischt, Richtung pro Satz zuf\u00e4llig.")
  : (d==="de"?"Du siehst die Frage und antwortest selbst \u2014 das trainiert Abrufen.":d==="pt"?"Du siehst die Antwort und nennst die passende Frage \u2014 festigt von der anderen Seite.":"Beides gemischt, pro Karte zuf\u00e4llig."); }
function einh(){ return istSpr()?"S\u00e4tze":"Fragen"; }
function katTag(c){
  try{ const k=(SCN||[]).find(x=>x.id===c.scn); if(!k) return ""; return `<p class="note" style="margin:0 0 6px">${k.icon||""} ${k.name}</p>`; }catch(e){ return ""; }
}
function postR(){ return (S.postBy||{})[S.rubrik]; }
function levelTest(kind){
  T={kind, q:testSet(), i:0, ok:0};
  testCard();
}
function testCard(){
  if(T.i>=T.q.length) return testDone();
  const c=T.q[T.i];
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>${T.kind==="pre"?"Startpunkt":"Endtest"}</span><span>${T.i+1} / ${T.q.length} \u00b7 ${T.ok} ok</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${cfg().say} \u2014 ohne Hilfe</p>
    ${katTag(c)}<p class="prompt">${c.de}</p>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn" onclick="testReveal()">Aufl\u00f6sen</button>
  </div>
  <p class="note">Beim ersten Mal wirst du vieles nicht k\u00f6nnen \u2014 das ist der Sinn. Genau diese 20 ${einh()} kommen am Ende nochmal.</p>`);
  countdown(istSpr()?5000:12000);
}
function testReveal(){
  clearInterval(timer);
  const c=T.q[T.i];
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>${T.kind==="pre"?"Startpunkt":"Endtest"}</span><span>${T.i+1} / ${T.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${c.de}</p>
    <p class="answer">${c.pt}</p>
    <div class="score">
      <button class="ok" onclick="testScore(1)">Hatte ich</button>
      <button class="no" onclick="testScore(0)">Nein</button>
    </div>
  </div>`);
}
function testScore(v){
  const c=T.q[T.i];
  if(v) T.ok++; else logError(c.id,c.de,c.pt);
  T.i++; testCard();
}
function testDone(){
  const r={score:T.ok, of:T.q.length, at:Date.now()};
  if(T.kind==="pre"){ S.preBy=S.preBy||{}; S.preBy[S.rubrik]=r; } else { S.postBy=S.postBy||{}; S.postBy[S.rubrik]=r; } save();
  const pre=preR(), post=postR();
  render(`<div class="card"><h2>${T.kind==="pre"?"Dein Startpunkt":"Geschafft"}</h2>
  <p class="big">${T.ok}/${T.q.length}</p>
  ${T.kind==="pre"
    ? `<p class="note">Das ist deine Messlatte. Dieselben 20 ${einh()} kommen am Ende nochmal \u2014 der Unterschied ist dein Ergebnis.</p>`
    : `<p class="note" style="text-align:center">Vorher ${pre?pre.score+"/"+pre.of:"\u2013"} \u00b7 jetzt ${post.score}/${post.of}${pre?` \u00b7 <b style="color:var(--accent)">+${post.score-pre.score}</b>`:""}</p>`}
  <button class="btn ghost" onclick="home()">Zur\u00fcck</button></div>`);
}

/* ---------------- Abruf-Drill ---------------- */
function scnList(){
  const d=S.dir||"de";
  render(`<button class="back" onclick="home()">\u2039 zur\u00fcck</button><h2>Abruf nach ${istSpr()?"Szenario":"Bereich"}</h2>
  <div class="card">
    <p class="sub">Richtung</p>
    <div class="row" style="margin-top:8px">
      ${[["de",dirLbl("de")],["pt",dirLbl("pt")],["mix","gemischt"]].map(o=>
        `<button class="btn ghost sm" style="margin:0;${d===o[0]?"border-color:var(--accent);color:var(--accent)":""}" onclick="setDir('${o[0]}')">${o[1]}</button>`).join("")}
    </div>
    <p class="note" style="margin-top:10px">${dirNote(d)}</p>
  </div>
  <button class="tile" onclick="drillScn('focus')"><span class="ic">\u2b50</span><span>Nur Fokus-${istSpr()?"Szenarien":"Bereiche"}<small>${focusObj().t} \u00b7 gemischt</small></span><span class="chev">\u203a</span></button>
  <button class="tile" onclick="drillScn('all')"><span class="ic">\ud83c\udf00</span><span>Alles gemischt<small>Interleaved \u2014 \u00fcbertr\u00e4gt am besten</small></span><span class="chev">\u203a</span></button>
  ${[...SCN].filter(s=>CHUNKS.some(c=>c.scn===s.id)).sort((a,b)=>(inFocus(b.id)?1:0)-(inFocus(a.id)?1:0)).map(s=>{
    const items=CHUNKS.filter(c=>c.scn===s.id);
    const ok=items.filter(c=>(S.box[c.id]||0)>=3).length;
    const f=inFocus(s.id);
    return `<button class="tile" onclick="drillScn('${s.id}')" style="${f?"":"opacity:.55"}">
    <span class="ic">${s.icon}</span><span>${s.name}${f?' <span style="color:var(--accent);font-size:11px">\u00b7 FOKUS</span>':""}<small>${ok}/${items.length} sitzen</small></span><span class="chev">\u203a</span></button>`;
  }).join("")}`);
}

function setDir(d){ S.dir=d; save(); scnList(); }
function dirFor(){ const d=S.dir||"de"; return d==="mix" ? (Math.random()<0.5?"de":"pt") : d; }

function drillScn(id){
  if(id==="all") return drill(CHUNKS.map(c=>c.id), "Alles gemischt");
  if(id==="focus") return drill(focusPool().map(c=>c.id), focusObj().t);
  const s=SCN.find(x=>x.id===id);
  drill(CHUNKS.filter(c=>c.scn===id).map(c=>c.id), s?s.name:"Drill");
}
function drillErrors(){ drill(S.errors.map(e=>e.id), "Fehlerliste"); }
function drillAgain(){ if(D) drill(D.q.map(c=>c.id), D.label); }

let D=null;
function drill(ids, label){
  const pool=ids.map(id=>CHUNKS.find(c=>c.id===id)).filter(Boolean);
  if(!pool.length){ render(`<button class="back" onclick="home()">\u2039 zur\u00fcck</button><div class="card"><h2>Noch nichts drin</h2><p class="note">Die Fehlerliste f\u00fcllt sich automatisch, sobald du in einem Drill stockst.</p></div>`); return; }
  const sorted=shuffle(pool).sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0));
  const q=sorted.slice(0,14);
  D={q, i:0, label, ok:0, mid:0, no:0, dirs:q.map(c=>c.scn==="w"?"de":dirFor(c))};
  drillCard();
}
function drillCard(){
  if(D.i>=D.q.length) return drillDone();
  const c=D.q[D.i], toPt=D.dirs[D.i]!=="pt";
  const st = toPt ? stageOf(c) : "lesen";
  let body;
  if(st==="schreiben"){
    body = `<input class="txt" id="ans" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="${istSpr()?'in der Zielsprache tippen':'Antwort tippen'}">
      <button class="btn" onclick="drillCheck()">Pr\u00fcfen</button>`;
  } else if(st==="sprechen"){
    body = `<button class="btn" onclick="micDrill()">\ud83c\udfa4 Antwort sprechen</button>
      <p class="note" id="micst" style="text-align:center;margin-top:8px">Antippen, dann laut sagen</p>
      <button class="btn ghost sm" onclick="noVoice()">Kann gerade nicht sprechen</button>`;
  } else {
    body = `<button class="btn" onclick="drillReveal()">Gesagt \u2014 aufl\u00f6sen</button>`;
  }
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>${D.label} \u00b7 ${dirLbl(toPt?"de":"pt")}</span><span>${D.i+1} / ${D.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${istSpr()&&c.scn!=="w"?STAGE_T[st]:"Laut antworten"}</p>
    ${katTag(c)}<p class="prompt">${toPt?c.de:c.pt}</p>
    <div class="bar" id="bar"><i></i></div>
    ${body}
  </div>
  <p class="note">${st==="lesen"?"Erst laut sagen, dann aufl\u00f6sen \u2014 auch wenn du unsicher bist."
    :st==="schreiben"?"Akzente kannst du weglassen, die z\u00e4hlen nicht."
    :"Sprich normal, nicht \u00fcberdeutlich."}</p>`);
  if(st==="schreiben"){
    const i=document.getElementById("ans"); if(i){ i.focus(); i.addEventListener("keydown",e=>{ if(e.key==="Enter") drillCheck(); }); }
  }
  countdown(!istSpr()?12000:st==="lesen"?4000:9000);
}
function noVoice(){ S.mic=false; save(); drillCard(); }
function drillCheck(){
  const c=D.q[D.i];
  const raw=(document.getElementById("ans")||{value:""}).value;
  const d=lev(norm(raw), norm(c.pt)), sim=1-d/Math.max(norm(c.pt).length,1);
  drillReveal({v: sim>=0.92?"ok":sim>=0.7?"near":"no", heard:raw, typed:true});
}
let timer=null;
function countdown(ms, onEnd){
  clearInterval(timer);
  const bar=document.querySelector("#bar>i"); if(!bar) return;
  const t0=Date.now();
  timer=setInterval(()=>{
    const p=1-(Date.now()-t0)/ms;
    if(p<=0){ clearInterval(timer); bar.style.width="0%"; document.getElementById("bar").classList.add("warn"); if(onEnd) onEnd(); return; }
    bar.style.width=(p*100)+"%";
    if(p<.34) document.getElementById("bar").classList.add("warn");
  },60);
}
function micDrill(){
  const c=D.q[D.i];
  clearInterval(timer);
  listen(c.pt, res=>{
    if(!res) return;
    drillReveal(res);
  });
}
function drillReveal(res){
  clearInterval(timer);
  const c=D.q[D.i], toPt=D.dirs[D.i]!=="pt";
  S.said++; save();
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>${D.label} \u00b7 ${dirLbl(toPt?"de":"pt")}</span><span>${D.i+1} / ${D.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${toPt?c.de:c.pt}</p>
    <p class="answer">${res&&toPt?wordDiff(res.heard,c.pt):(toPt?c.pt:c.de)}</p>
    ${res?`<p class="note">${res.typed?"Getippt":"Geh\u00f6rt"}: \u201e${res.heard}\u201c \u2014 <b style="color:${res.v==="ok"?"var(--accent)":res.v==="near"?"var(--mid)":"var(--bad)"}">${res.v==="ok"?"richtig":res.v==="near"?"fast":"daneben"}</b></p>`:""}
    ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(c.pt).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
    <div class="score">
      <button class="ok" onclick="drillScore(2)">${res&&res.v==="ok"?"\u2713 ":""}Sa\u00df sofort</button>
      <button class="mid" onclick="drillScore(1)">Gestockt</button>
      <button class="no" onclick="drillScore(0)">Keine Ahnung</button>
    </div>
  </div>`);
}
function drillScore(v){
  const c=D.q[D.i];
  const b=S.box[c.id]||0;
  if(v===2){ S.box[c.id]=Math.min(5,b+2); D.ok++; clearError(c.id); }
  if(v===1){ S.box[c.id]=Math.max(1,b); D.mid++; logError(c.id,c.de,c.pt); }
  if(v===0){ S.box[c.id]=0; D.no++; logError(c.id,c.de,c.pt); D.q.push(c); }
  save(); D.i++; drillCard();
}
function drillDone(){
  render(`<div class="card"><h2>Runde durch</h2>
  <div class="stat" style="margin-top:12px">
    <div><b class="done">${D.ok}</b><span>sa\u00df</span></div>
    <div><b>${D.mid}</b><span>gestockt</span></div>
    <div><b class="fail">${D.no}</b><span>weg</span></div>
  </div>
  <p class="note">Was du nicht sofort konntest, steht jetzt in der Fehlerliste und kommt im n\u00e4chsten Wiederholungsfenster wieder.</p>
  <button class="btn" onclick="drillAgain()">Noch eine Runde</button>
  <button class="btn ghost" onclick="home()">Fertig</button></div>`);
}

/* ---------------- Mix / Prüfung ---------------- */
let M=null;
function mix(n, secs, testNo){
  if(!istSpr()) secs=secs*3;
  // Prüfung 3: die ersten vier Fokus-Szenarien. Prüfung 5: 70 % Fokus, 30 % Rest.
  const fp=focusPool(), rest=CHUNKS.filter(c=>!inFocus(c.scn));
  let pool;
  if(testNo===3){
    const first4=focusObj().scn.slice(0,4);
    pool=CHUNKS.filter(c=>first4.includes(c.scn));
  } else {
    const nf=Math.round(n*0.7);
    pool=shuffle(fp).slice(0,nf).concat(shuffle(rest).slice(0,n-nf));
  }
  M={q:shuffle(pool).slice(0,n), i:0, secs, testNo, ok:0, need: testNo===3?16:24};
  mixCard();
}
function mixCard(){
  if(M.i>=M.q.length) return mixDone();
  const c=M.q[M.i];
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung ${M.testNo} \u00b7 ${M.secs} Sek</span><span>${M.i+1} / ${M.q.length} \u00b7 ${M.ok} ok</span></div>
  <div class="card" style="margin-top:10px">
    ${katTag(c)}<p class="prompt">${c.de}</p>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn" onclick="mixReveal()">Gesagt</button>
  </div>`);
  countdown(M.secs*1000, mixReveal);
}
function mixReveal(){
  clearInterval(timer);
  const c=M.q[M.i];
  S.said++; save();
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung ${M.testNo}</span><span>${M.i+1} / ${M.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${c.de}</p>
    <p class="answer">${c.pt}</p>
    ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(c.pt).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
    <div class="score">
      <button class="ok" onclick="mixScore(1)">Hatte ich \u2014 in der Zeit</button>
      <button class="no" onclick="mixScore(0)">Nein</button>
    </div>
  </div>`);
}
function mixScore(v){
  const c=M.q[M.i];
  if(v){ M.ok++; S.box[c.id]=Math.min(5,(S.box[c.id]||0)+1); clearError(c.id); }
  else { S.box[c.id]=0; logError(c.id,c.de,c.pt); }
  save(); M.i++; mixCard();
}
function mixDone(){
  const pass=M.ok>=M.need;
  S.tests[M.testNo]={pass, score:M.ok+"/"+M.q.length}; save();
  render(`<div class="card"><h2>Pr\u00fcfung ${M.testNo}</h2>
  <p class="big ${pass?'done':'fail'}">${M.ok}/${M.q.length}</p>
  <p style="text-align:center" class="${pass?'done':'fail'}">${pass?"Bestanden":"Nicht bestanden \u2014 n\u00f6tig: "+M.need}</p>
  <p class="note">${pass?"Weiter im Stundenplan.":"Dieser Block kommt im n\u00e4chsten Wiederholungsfenster nochmal. Der Tag l\u00e4uft normal weiter."}</p>
  <button class="btn ghost" onclick="home()">Zur\u00fcck</button></div>`);
}

/* ---------------- Lesen ---------------- */
let L=null;
function lesen(){ L={q:shuffle(LESEN), i:0, bad:0}; lesenCard(); }
function lesenCard(){
  if(L.i>=L.q.length) return lesenDone();
  const w=L.q[L.i];
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung 1 \u00b7 Vorlesen</span><span>${L.i+1} / ${L.q.length} \u00b7 ${L.bad} Fehler</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">Laut vorlesen, dann aufl\u00f6sen</p>
    <p class="prompt" style="font-size:34px">${w.word}</p>
    <button class="btn" onclick="lesenReveal()">Gelesen</button>
  </div>`);
}
function lesenReveal(){
  const w=L.q[L.i]; S.said++; save();
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung 1</span><span>${L.i+1} / ${L.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="prompt" style="font-size:30px">${w.word}</p>
    <p class="answer" style="font-size:22px">${w.say}</p>
    <p class="hint">${w.rule}</p>
    ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(w.word).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
    <div class="score">
      <button class="ok" onclick="lesenScore(1)">Richtig gelesen</button>
      <button class="no" onclick="lesenScore(0)">Falsch</button>
    </div>
  </div>`);
}
function lesenScore(v){ if(!v) L.bad++; L.i++; lesenCard(); }
function lesenDone(){
  const pass=L.bad<=3;
  S.tests[1]={pass, score:(L.q.length-L.bad)+"/"+L.q.length}; save();
  render(`<div class="card"><h2>Pr\u00fcfung 1 \u00b7 Lesen</h2>
  <p class="big ${pass?'done':'fail'}">${L.bad}</p>
  <p style="text-align:center" class="${pass?'done':'fail'}">${pass?"Bestanden":"Nicht bestanden"} \u2014 erlaubt sind 3 Fehler</p>
  <button class="btn ghost" onclick="home()">Zur\u00fcck</button></div>`);
}

/* ---------------- Hebel ---------------- */
let H=null;
function hebel(){ H={q:shuffle(HEBEL).slice(0,40), i:0, ok:0, t0:Date.now()}; hebelCard(); }
function hebelCard(){
  if(H.i>=H.q.length) return hebelDone();
  const h=H.q[H.i];
  const left=Math.max(0, 300-Math.round((Date.now()-H.t0)/1000));
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung 2 \u00b7 ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")} \u00fcbrig</span><span>${H.i+1} / ${H.q.length} \u00b7 ${H.ok} ok</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">Englisch \u2192 Portugiesisch</p>
    <p class="prompt">${h.it}</p>
    <input class="txt" id="in" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="tippen, Akzente egal">
    <button class="btn" onclick="hebelCheck()">Pr\u00fcfen</button>
  </div>`);
  const i=document.getElementById("in");
  i.focus();
  i.addEventListener("keydown",e=>{ if(e.key==="Enter") hebelCheck(); });
}
function hebelCheck(){
  const h=H.q[H.i];
  const raw=(document.getElementById("in")||{value:""}).value;
  const right = norm(raw)===norm(h.pt);
  if(right) H.ok++;
  render(`<button class="back" onclick="home()">\u2039 abbrechen</button>
  <div class="meta"><span>Pr\u00fcfung 2</span><span>${H.i+1} / ${H.q.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${h.it}</p>
    <p class="answer" style="${right?"":"color:var(--bad)"}">${h.pt}</p>
    <p class="hint">${right?"Richtig.":"Du hattest: "+(raw.trim()||"nichts")}</p>
    ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(h.pt).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
    <button class="btn" onclick="hebelNext()">Weiter</button>
  </div>`);
}
function hebelNext(){ H.i++; hebelCard(); }
function hebelDone(){
  const pass=H.ok>=30;
  S.tests[2]={pass, score:H.ok+"/"+H.q.length}; save();
  render(`<div class="card"><h2>Pr\u00fcfung 2 \u00b7 Hebel</h2>
  <p class="big ${pass?'done':'fail'}">${H.ok}/${H.q.length}</p>
  <p style="text-align:center" class="${pass?'done':'fail'}">${pass?"Bestanden":"Nicht bestanden \u2014 n\u00f6tig: 30"}</p>
  <button class="btn ghost" onclick="home()">Zur\u00fcck</button></div>`);
}

/* ---------------- Missionen ---------------- */
function missionList(){
  render(`<button class="back" onclick="home()">\u2039 zur\u00fcck</button><h2>Missionen</h2>
  <p class="note" style="margin-bottom:12px">Ich sage etwas, du hast eine Aufgabe. Erst laut antworten, dann die Musterantwort ansehen.</p>
  ${SCN.filter(s=>MISSIONS[s.id]).map(s=>`<button class="tile" onclick="mission('${s.id}')"><span class="ic">${s.icon}</span><span>${MISSIONS[s.id].title}<small>${s.name} \u00b7 ${MISSIONS[s.id].turns.length} Z\u00fcge</small></span><span class="chev">\u203a</span></button>`).join("")}`);
}
let MI=null;
function mission(id){ MI={id, i:0, shown:false}; missionCard(); }
function missionCard(){
  const m=MISSIONS[MI.id];
  if(MI.i>=m.turns.length){
    markMission(MI.id);
    render(`<div class="card"><h2>Mission erf\u00fcllt</h2><p class="note">${m.title} \u2014 durch. Wenn du irgendwo mehr als 5 Sekunden gebraucht hast, spiel sie gleich nochmal.</p>
    <button class="btn" onclick="mission('${MI.id}')">Nochmal</button>
    <button class="btn ghost" onclick="missionList()">Andere Mission</button></div>`); return;
  }
  const t=m.turns[MI.i];
  render(`<button class="back" onclick="missionList()">\u2039 abbrechen</button>
  <div class="meta"><span>${m.title}</span><span>Zug ${MI.i+1} / ${m.turns.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="who">${t.who}</p>
    <p class="said">${t.said}</p>
    ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(t.said).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
    <div class="task" style="margin-top:14px">${t.task}</div>
    ${MI.shown?`<p class="answer" style="margin-top:14px">${t.model}</p>
      ${hasVoice()?`<button class="btn ghost sm" onclick="speak(${JSON.stringify(t.model).replace(/"/g,"&quot;")})">🔊 anhören</button>`:""}
      <div class="score"><button class="ok" onclick="missionNext(1)">Hatte ich</button><button class="no" onclick="missionNext(0)">Daneben</button></div>`
     :`<button class="btn" onclick="missionShow()">Gesagt \u2014 Musterantwort</button>`}
  </div>`);
}
function missionShow(){ MI.shown=true; S.said++; save(); missionCard(); }
function markMission(id){ S.missDone=S.missDone||{}; S.missDone[id]=true; save(); }
function missionNext(ok){
  const t=MISSIONS[MI.id].turns[MI.i];
  if(!ok) logError("m-"+MI.id+"-"+MI.i, t.task, t.model);
  MI.i++; MI.shown=false; missionCard();
}

/* ---------------- 4/3/2 ---------------- */
function f432List(){
  render(`<button class="back" onclick="home()">\u2039 zur\u00fcck</button><h2>4/3/2 Monolog</h2>
  <p class="note" style="margin-bottom:12px">Dasselbe Thema dreimal: 4 Minuten, dann 3, dann 2. Gleicher Inhalt, weniger Zeit \u2014 das erzwingt Tempo. Nicht aufschreiben, nur reden.</p>
  ${TOPICS.map((t,i)=>`<button class="tile" onclick="f432(${i})"><span class="ic">\ud83d\udde3\ufe0f</span><span>${t.t}<small>3 Runden \u00b7 9 Minuten</small></span><span class="chev">\u203a</span></button>`).join("")}`);
}
let F=null;
function f432(idx){ F={idx, round:0, used:[]}; f432Card(); }
function f432Card(){
  const t=TOPICS[F.idx], secs=[240,180,120][F.round];
  if(F.round>2){
    render(`<div class="card"><h2>Durch</h2><p class="note">Drei Runden \u00fcber \u201e${t.t}\". Beim dritten Mal sollte es deutlich flie\u00dfender gelaufen sein als beim ersten \u2014 genau das ist der Effekt.</p>
    <button class="btn" onclick="f432(${F.idx})">Nochmal</button><button class="btn ghost" onclick="f432List()">Anderes Thema</button></div>`); return;
  }
  render(`<button class="back" onclick="f432List()">\u2039 abbrechen</button>
  <div class="meta"><span>${t.t}</span><span>Runde ${F.round+1} / 3</span></div>
  <div class="card" style="margin-top:10px">
    <p class="big" id="clock">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</p>
    <button class="btn" id="startBtn" onclick="f432Start(${secs})">Los \u2014 reden</button>
    <p class="sub" style="margin-top:14px">Diese Bausteine einbauen (antippen, wenn benutzt):</p>
    <ul class="ck">${t.hints.map((h,i)=>`<li onclick="this.classList.toggle('on')">${h}</li>`).join("")}</ul>
  </div>`);
}
function f432Start(secs){
  const btn=document.getElementById("startBtn"); btn.textContent="l\u00e4uft \u2026"; btn.disabled=true;
  let left=secs;
  clearInterval(timer);
  timer=setInterval(()=>{
    left--;
    const c=document.getElementById("clock");
    if(!c){ clearInterval(timer); return; }
    c.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(left<=0){ clearInterval(timer); S.said++; if(F.round>=2){ S.f432Done=(S.f432Done||0)+1; } save(); F.round++; f432Card(); }
  },1000);
}

/* ---------------- Export ---------------- */
function exportView(){
  const txt=S.errors.map(e=>e.de+" | "+e.pt).join("\n");
  render(`<button class="back" onclick="home()">\u2039 zur\u00fcck</button><h2>Fehlerliste (${S.errors.length})</h2>
  ${S.errors.length?`<div class="card">${S.errors.map(e=>`<div class="err">${e.de}<br><b>${e.pt}</b></div>`).join("")}</div>
  <button class="btn" onclick="copyErr()">Als Text kopieren</button>
  <button class="btn ghost" onclick="if(confirmClear())home()">Liste leeren</button>
  <p class="note" id="msg" style="margin-top:10px">Format: Frage | Antwort \u2014 passt direkt in einen Anki-Import.</p>`
  :`<div class="card"><p class="note">Noch leer. Sie f\u00fcllt sich, sobald du in einem Drill stockst oder eine Mission verhaust.</p></div>`}`);
  window.__errTxt=txt;
}
function copyErr(){
  try{ navigator.clipboard.writeText(window.__errTxt||"").then(()=>{
    const m=document.getElementById("msg"); if(m){ m.textContent="Kopiert."; m.className="note done"; }
  }).catch(()=>fallbackCopy()); }catch(e){ fallbackCopy(); }
}
function fallbackCopy(){
  const m=document.getElementById("msg");
  if(m){ m.textContent="Kopieren hat nicht geklappt \u2014 markiere den Text oben von Hand."; }
}
function confirmClear(){ snapshot(); S.errors=[]; save(); return true; }

S.rubrik=S.rubrik||"pt";
applyRubrik();
applyTheme();
home();
