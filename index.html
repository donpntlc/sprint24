<style>
:root{
  --bg:#191714; --card:#211e1a; --card2:#282420; --line:#332e28;
  --ink:#f1ece4; --dim:#a79e93; --accent:#8fd6a9; --accent2:#e8b87a; --bad:#eb8073; --mid:#e0b35c;
  --on:#15301f; --r:20px; --font:Nunito; --fontH:Nunito;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font),system-ui,-apple-system,sans-serif}
body{background:
  radial-gradient(120% 55% at 20% -12%, rgba(143,214,169,.09), transparent 62%),
  radial-gradient(90% 45% at 95% 2%, rgba(232,184,122,.07), transparent 58%),
  var(--bg);
  background-attachment:fixed}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:18px 16px 90px}
h1{font-family:var(--fontH),sans-serif;font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;
  color:var(--ink)}
h2{font-family:var(--fontH),sans-serif;font-size:17px;font-weight:700;margin:0 0 10px}
p{line-height:1.5}
.sub{color:var(--dim);font-size:13px;margin:4px 0 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.flag{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8fd6a9,#e8b87a);flex:0 0 auto;
  box-shadow:0 3px 12px rgba(143,214,169,.25);border-radius:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 10px rgba(0,0,0,.22)}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:10px;color:var(--ink);font-size:15.5px;font-weight:700;font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 2px 10px rgba(0,0,0,.20);transition:transform .12s ease,border-color .12s ease}
.tile small{display:block;color:var(--dim);font-weight:400;font-size:12.5px;margin-top:3px}
.tile .ic{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.tile .chev{margin-left:auto;color:var(--dim)}
button{cursor:pointer}
.tile:active{transform:scale(.985);border-color:var(--accent)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;border:0;
  background:var(--accent);color:var(--on);
  font:800 16px var(--font),sans-serif;margin-top:10px;border-radius:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:11px;font-size:14px}
.row{display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid2 .btn{margin:0;width:100%;padding:12px 8px;font-size:13.5px;line-height:1.2}
.row>*{flex:1}
.prompt{font-size:26px;font-weight:700;line-height:1.3;margin:6px 0 2px;letter-spacing:-.02em}
.answer{font-size:24px;font-weight:700;color:var(--accent);line-height:1.35;margin:2px 0}
.hint{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.5}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0}
.bar>i{display:block;height:100%;background:var(--accent);width:100%;transition:width .1s linear}
.bar.warn>i{background:var(--mid)}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.score{display:flex;gap:8px;margin-top:14px}
.score button{flex:1;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:600 13px var(--font),sans-serif}
.score .ok{border-color:#3f6b4f;color:#9fe0b4;border-radius:14px}
.score .mid{border-color:#6b5a3a;color:#f0cf9b;border-radius:14px}
.score .no{border-color:#6b3c35;color:#f0ada2;border-radius:14px}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;
  font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.stat{display:flex;gap:10px;margin:2px 0 14px}
.stat div{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:13px 10px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--accent)}
.stat span{font-size:10.5px;white-space:nowrap;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.back{background:none;border:0;color:var(--dim);font:600 14px Nunito,sans-serif;padding:0 0 14px}
.who{color:var(--accent2);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.said{font-size:21px;font-weight:600;line-height:1.35;margin:6px 0 14px}
.task{background:var(--card2);border-left:3px solid var(--accent2);padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.45}
.big{font-size:54px;font-weight:800;text-align:center;letter-spacing:-.03em;margin:10px 0;font-variant-numeric:tabular-nums}
ul.ck{list-style:none;padding:0;margin:10px 0 0}
ul.ck li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:14.5px}
ul.ck li.on{border-color:var(--accent);color:var(--accent)}
input.txt{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:600 18px Nunito,sans-serif;margin-top:10px}
input.txt:focus{outline:2px solid var(--accent);border-color:transparent}
textarea.txt{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:400 16px Nunito,sans-serif;line-height:1.45;margin-top:10px;resize:vertical}
textarea.txt:focus{outline:2px solid var(--accent);border-color:transparent}
summary.sum{color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0}
ol.steps{margin:8px 0 6px;padding-left:20px;color:var(--dim);font-size:13.5px;line-height:1.55}
ol.steps b{color:var(--ink)}
select.sel{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:600 15px Nunito,sans-serif;margin-top:8px}
.err{font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.4}
.err b{color:var(--accent)}
.note{color:var(--dim);font-size:13px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  border-radius:99px;padding:9px 13px;font:700 13px var(--font),sans-serif}
.chip i{width:12px;height:12px;border-radius:99px;display:inline-block}
.hdr{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 2px 10px rgba(0,0,0,.20)}
.hdr .flag{width:42px;height:42px;flex:0 0 auto;margin:0}
.hdr .flag.ric{display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1}
.flag.v-farbe{background:linear-gradient(135deg,#8fd6a9,#e8b87a);box-shadow:0 3px 12px rgba(143,214,169,.25);
  text-shadow:0 1px 3px rgba(0,0,0,.30)}
.flag.v-ruhig{background:linear-gradient(140deg, rgba(143,214,169,.18), rgba(232,184,122,.13));border:1px solid var(--line);box-shadow:none}
.flag.v-leer{background:linear-gradient(135deg,#8fd6a9,#e8b87a);box-shadow:0 3px 12px rgba(143,214,169,.25)}
.vprev{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.hdr .hdrtx{flex:1 1 auto;min-width:0}
.hdr .hdrtx b{display:block;font-family:var(--fontH),sans-serif;font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hdr .hdrtx small{display:block;margin-top:3px;color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hdrico{flex:0 0 auto;font-size:18px;opacity:.7}
.hdr:active{border-color:var(--accent)}
.sep{border:0;border-top:1px solid var(--line);margin:22px 0 0}
.shead{font-family:var(--fontH),sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:16px 0 10px}
.shead small{display:block;font-family:var(--font),sans-serif;font-size:12.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:3px}
body.sol h2{text-transform:none;letter-spacing:.01em;font-size:19px}
body.sol .tile,body.sol .card{border-radius:14px}
body.sol .btn{border-radius:10px;letter-spacing:.02em;text-transform:uppercase}
body.sol .top{padding-bottom:4px}
.done{color:var(--accent);font-weight:700}
.fail{color:var(--bad);font-weight:700}
.chat{margin:10px 0 16px}
.bub{max-width:88%;margin:8px 0;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.bub.them{border-top-left-radius:4px}
.bub.me{margin-left:auto;background:var(--card2);border-top-right-radius:4px;border-color:var(--accent)}
.bub p{margin:0;font-size:16px;line-height:1.45}
.bub small{display:block;margin-top:4px;color:var(--dim);font-size:12.5px}
.bub small.corr{color:var(--accent)}
.bub .nm{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.bub .mini{margin-top:6px;background:none;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:3px 8px;border-radius:999px}
.grph{display:flex;align-items:center;width:100%;gap:10px;margin:14px 0 2px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-align:left}
.grph span{font-family:var(--fontH);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.grph small{display:block;font-family:var(--font);font-size:12px;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:2px}
.grph .arr{margin-left:auto;color:var(--accent);font-size:20px;line-height:1}
.grph .gic{font-size:22px;line-height:1;flex:0 0 auto}
.grph .gtx{flex:1 1 auto;min-width:0}
.grpwrap{margin:12px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.grpwrap .grph{margin:0;border:0;border-radius:0;background:transparent;width:100%}
.grpwrap.open .grph{border-bottom:1px solid var(--line)}
.grpbody{padding:4px 10px 10px;background:rgba(0,0,0,.22)}
.grpbody .tile{margin:8px 0;background:var(--card2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:13px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.gear{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:17px;line-height:1;color:var(--ink);flex:0 0 auto}
.top{display:flex;align-items:center;gap:12px}
</style>
</head>

function rubProg(id){
  const d=RUBRIK_DATA[id]; if(!d) return null;
  const items=d.chunks, ok=items.filter(c=>(S.box[c.id]||0)>=3).length;
  const pct=items.length?Math.round(ok/items.length*100):0;
  const post=(S.postBy||{})[id], pre=(S.preBy||{})[id];
  const started = ok>0 || !!pre || ((S.exams||[]).some(x=>x.rubrik===id));
  return {pct, ok, n:items.length, started, done: pct>=90 || !!post};
}
function setRubrik(id){ S.rubrik=id; save(); applyRubrik(); loadVoices(); save(); home(); }
function focusProg(f, rub){
  const d=rub?RUBRIK_DATA[rub]:null, items=(d?d.chunks:CHUNKS).filter(c=>f.scn.includes(c.scn));
  const ok=items.filter(c=>(S.box[c.id]||0)>=3).length;
  return {ok, n:items.length, pct:items.length?Math.round(ok/items.length*100):0};
}
function focusObj(){ return (FOCI||[]).find(f=>f.id===S.focus)||FOCI[0]; }
function inFocus(scn){ return focusObj().scn.includes(scn); }
function focusPool(){
  const all=CHUNKS.filter(c=>inFocus(c.scn));
  if(S.plan!=="12") return all;
  // 12-Stunden-Sprint: pro Bereich nur die ersten acht \u2014 der Kern
  const byCat={};
  return all.filter(c=>{ byCat[c.scn]=(byCat[c.scn]||0)+1; return byCat[c.scn]<=8; });
}
function planObj(){ return PLANS.find(x=>x.id===S.plan)||PLANS[1]; }

function baseObj(){ return BASES.find(b=>b.id===S.base)||BASES[0]; }
function accObj(){ return ACCENTS.find(a=>a.id===S.accent)||ACCENTS[0]; }
function applyTheme(){
  const b=baseObj(), a=accObj(), r=document.documentElement.style;
  r.setProperty("--bg",b.bg); r.setProperty("--card",b.card); r.setProperty("--card2",b.card2);
  r.setProperty("--line",b.line); r.setProperty("--ink",b.ink); r.setProperty("--dim",b.dim);
  r.setProperty("--accent",a.c); r.setProperty("--accent2",a.c2); r.setProperty("--on",a.on);
  r.setProperty("--font", b.font||"Nunito"); r.setProperty("--fontH", b.fontH||b.font||"Nunito");
  r.setProperty("--r", b.r||"20px");
  document.body.classList.toggle("sol", b.id==="sol");
  document.body.style.background=
    `radial-gradient(120% 55% at 20% -12%, ${a.c}14, transparent 62%),`+
    `radial-gradient(90% 45% at 95% 2%, ${a.c2}10, transparent 58%), ${b.bg}`;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",b.bg);
}
function setBase(id){ S.base=id; save(); applyTheme(); home(); }
function setAccent(id){ S.accent=id; save(); applyTheme(); home(); }
function themeCard(){
  const b=baseObj(), a=accObj();
  return `<div class="card">
    <p class="sub">Farben</p>
    <p class="note" style="margin:6px 0 8px">Grundton</p>
    <div class="chips">${BASES.map(x=>`<button class="chip" onclick="setBase('${x.id}')" style="background:${x.card};${b.id===x.id?"border-color:var(--accent);color:var(--accent)":""}">${x.t}</button>`).join("")}</div>
    <p class="note" style="margin:12px 0 8px">Akzent</p>
    <div class="chips">${ACCENTS.map(x=>`<button class="chip" onclick="setAccent('${x.id}')" style="${a.id===x.id?"border-color:"+x.c+";color:"+x.c:""}"><i style="background:${x.c}"></i>${x.t}</button>`).join("")}</div>
  </div>`;
}

const B_CHUNKS=[
["b1","Was heißt „Kanon“?","Die Liste der Bücher, die in die Bibel gehören. Das griechische Wort heisst „Maßstab“ — also woran die Kirche misst, was Heilige Schrift ist und was nicht."],
["b1","Was ist die Septuaginta?","Die älteste griechische Übersetzung des Alten Testaments, entstanden ab dem 3. Jahrhundert vor Christus. Wenn das Neue Testament das Alte zitiert, zitiert es meist diese Fassung."],
["b1","Welche Bücher nennen Orthodoxe und Katholiken deuterokanonisch?","Tobit, Judit, Weisheit, Jesus Sirach, Baruch, 1. und 2. Makkabäer, dazu Ergänzungen zu Ester und Daniel. „Deuterokanonisch“ heisst: später zum Kanon dazugekommen."],
["b1","Warum fehlen die deuterokanonischen Bücher in den meisten evangelischen Bibeln?","Die Reformatoren hielten sich an die jüdische Bibel, in der diese Bücher nicht stehen. Luther druckte sie als „Apokryphen“ zwischen Altem und Neuem Testament."],
["b1","Wann wird der heutige 27-Bücher-Kanon des Neuen Testaments zuerst genau so aufgezählt?","Im Jahr 367, in einem Osterbrief von Bischof Athanasius aus Alexandrien. Dort stehen zum ersten Mal genau die 27 Bücher, die wir heute haben."],
["b1","Wer hat den Kanon der Bibel festgelegt?","Niemand allein. Die Gemeinden lasen über Jahrhunderte bestimmte Schriften im Gottesdienst, und Bischofsversammlungen bestätigten diesen Gebrauch später, etwa in Karthago 397."],
["b1","Was ist die Vulgata?","Die lateinische Bibel, die Hieronymus um das Jahr 400 übersetzte. Im Westen war sie über tausend Jahre lang die Bibel schlechthin."],
["b1","Wie ist das Alte Testament gegliedert?","In vier Blöcke: die fünf Bücher Mose, die Geschichtsbücher, die Weisheitsbücher mit den Psalmen und die Propheten."],
["b1","Woraus besteht das Neue Testament?","Aus 27 Büchern: vier Evangelien, die Apostelgeschichte, 21 Briefe und die Offenbarung."],

["b2","Welche drei Evangelien nennt man synoptisch und warum?","Matthäus, Markus und Lukas. Sie erzählen dieselben Ereignisse in ähnlicher Reihenfolge, man kann sie nebeneinanderlegen und vergleichen — genau das heisst „Synopse“."],
["b2","Welches Evangelium gilt als das älteste?","Markus, geschrieben um das Jahr 65 bis 70. Matthäus und Lukas übernehmen vieles daraus."],
["b2","Für wen schreibt Matthäus erkennbar?","Für Christen jüdischer Herkunft. Er zeigt immer wieder, wie sich Verheißungen des Alten Testaments erfüllen, und zeichnet Jesus als den neuen Mose."],
["b2","Was ist für das Lukasevangelium typisch?","Er arbeitet wie ein Historiker und erzählt auffällig viel von Armen, Kranken und Frauen. Seine Fortsetzung ist die Apostelgeschichte."],
["b2","Was unterscheidet das Johannesevangelium von den anderen drei Evangelien?","Kaum Gleichnisse, dafür lange Reden und sieben Zeichen. Typisch sind die „Ich bin“-Worte: ich bin das Brot, das Licht, der Weg."],
["b2","Wie beginnt das Johannesevangelium?","Mit dem Satz, dass das Wort im Anfang war und bei Gott war. Gemeint ist Christus, der schon vor seiner Geburt bei Gott ist."],
["b2","Was sind die Seligpreisungen?","Die Sätze, mit denen die Bergpredigt anfängt: selig die Armen im Geiste, selig die Trauernden. Sie stehen bei Matthäus in Kapitel 5."],
["b2","Was ist ein Gleichnis?","Eine kurze Geschichte aus dem Alltag, die etwas über Gott erklärt — zum Beispiel der barmherzige Samariter."],
["b2","Was meint die Passion?","Das Leiden, die Kreuzigung und den Tod Jesu. In allen vier Evangelien ist das der ausführlichste Teil."],

["b3","Wie fasst man die ganze Bibel in einem Satz zusammen?","Gott erschafft die Welt, der Mensch wendet sich ab, Gott ruft sich ein Volk, kommt selbst als Mensch, stirbt, steht auf und sammelt die Kirche."],
["b3","Was ist ein Bund?","Eine feste Zusage Gottes, die er nicht zurücknimmt — an Noah, Abraham, Mose und David. Jesus stiftet den neuen Bund."],
["b3","Was feiert Pascha oder Ostern?","Die Auferstehung Jesu von den Toten. Das ist der Kern des Glaubens; ohne sie bliebe vom Christentum nur Moral übrig."],
["b3","Was geschieht an Pfingsten?","Fünfzig Tage nach Ostern kommt der Heilige Geist auf die Apostel. Von da an tritt die Kirche öffentlich auf."],
["b3","Was heißt Inkarnation?","Dass Gott in Jesus wirklich Mensch geworden ist — mit Körper, Hunger und Tod, nicht nur zum Schein. Das Wort heisst wörtlich Fleischwerdung."],
["b3","Was meint die Dreifaltigkeit?","Ein einziger Gott, der als Vater, Sohn und Heiliger Geist begegnet. Nicht drei Götter und keine drei Rollen, sondern drei Personen, die eins sind."],
["b3","Wofür steht der Exodus?","Für den Auszug aus Ägypten, die Befreiung aus der Sklaverei. Jede spätere Rettung erzählt die Bibel nach diesem Muster."],
["b3","Was ist das Reich Gottes?","Gottes Herrschaft, die mit Jesus beginnt, aber noch nicht vollendet ist. Schon angebrochen — und noch nicht ganz da."],

["b4","Was änderte sich 313 für die Christen im Römischen Reich?","Konstantin beendet die Christenverfolgung: Christen dürfen ihren Glauben öffentlich leben. Bekannt als Mailänder Vereinbarung."],
["b4","Was legte das Konzil von Nizäa 325 fest?","Dass Christus wirklich Gott ist, aus demselben Wesen wie der Vater, und kein Geschöpf. Daraus entstand der erste Teil des Glaubensbekenntnisses."],
["b4","Was ergänzte das Konzil von Konstantinopel 381?","Die Sätze über den Heiligen Geist. Seitdem hat das Glaubensbekenntnis die Form, die bis heute gebetet wird."],
["b4","Worum ging es beim Konzil von Ephesus 431?","Ob Maria „Gottesgebärerin“ heissen darf. Antwort: ja — weil Jesus eine Person ist und nicht in einen göttlichen und einen menschlichen Teil zerfällt."],
["b4","Was beschloss das Konzil von Chalcedon 451?","Jesus ist ganz Gott und ganz Mensch: zwei Naturen in einer Person, weder vermischt noch voneinander getrennt."],
["b4","Wie viele ökumenische Konzilien erkennt die Orthodoxie an?","Sieben. Das letzte fand 787 in Nizäa statt."],
["b4","Worum ging es beim Konzil von Nizäa 787?","Um Ikonen. Ergebnis: Bilder darf man verehren, anbeten darf man nur Gott."],
["b4","Wer waren die Wüstenväter?","Mönche, die ab dem 3. Jahrhundert in die ägyptische Wüste gingen, um dort zu beten. Aus ihnen entstand das ganze Mönchtum."],
["b4","Wer sind die Kirchenväter?","Die frühen Lehrer der Kirche, deren Schriften bis heute Maßstab sind — etwa Ignatius, Athanasius, Basilius, Chrysostomos und Augustinus."],
["b4","Was ist die apostolische Sukzession?","Dass Bischöfe ihr Amt in einer ununterbrochenen Kette durch Handauflegung weitergeben, zurück bis zu den Aposteln."],

["b5","Was geschah 1054 zwischen Ost- und Westkirche?","Rom und Konstantinopel sprachen gegenseitig den Bann aus. Das ist der sichtbare Bruch zwischen West- und Ostkirche, das große Schisma."],
["b5","Welche zwei Streitpunkte stehen im Kern der Trennung von Ost- und Westkirche?","Erstens das Filioque im Glaubensbekenntnis, zweitens die Frage, wie viel Vollmacht der Papst über die ganze Kirche hat."],
["b5","Was heißt Filioque?","Lateinisch „und dem Sohn“. Der Westen ergänzte im Bekenntnis, der Heilige Geist gehe auch vom Sohn aus — der Osten sah darin eine eigenmächtige Änderung."],
["b5","Was geschah 1204 in Konstantinopel?","Kreuzfahrer eroberten und plünderten Konstantinopel, eine christliche Stadt. Danach war der Bruch nicht mehr nur theologisch, sondern persönlich."],
["b5","Was tat Luther 1517?","Er veröffentlichte 95 Thesen gegen den Ablasshandel, also gegen Geld für Straferlass. Daraus wurde die Reformation."],
["b5","Was meinen die vier „allein“ der Reformation?","Allein die Schrift, allein der Glaube, allein die Gnade, allein Christus. Jedes „allein“ grenzt gegen etwas ab, das den Reformatoren zu viel Gewicht bekommen hatte."],
["b5","Wie antwortete die katholische Kirche auf die Reformation?","Mit dem Konzil von Trient, 1545 bis 1563. Es klärte die Lehre und schaffte Missbräuche wie den Ablasshandel ab."],
["b5","Was unterscheidet orientalisch-orthodoxe Kirchen von den orthodoxen?","Sie erkennen das Konzil von Chalcedon 451 nicht an — Kopten, Armenier, Syrer, Äthiopier. Trotz des ähnlichen Namens stehen sie nicht in Gemeinschaft mit den orthodoxen Kirchen."],
["b5","Was war das Zweite Vatikanische Konzil?","Ein Konzil der katholischen Kirche von 1962 bis 1965. Die sichtbarsten Folgen: Gottesdienst in der Landessprache und ein offenerer Umgang mit anderen Kirchen."],

["b6","Wie viele Mysterien oder Sakramente zählen Orthodoxe und Katholiken?","Sieben: Taufe, Salbung (im Westen Firmung), Eucharistie, Beichte, Krankensalbung, Ehe und Weihe. „Mysterium“ ist das östliche Wort für Sakrament."],
["b6","Wie viele Sakramente zählen die meisten evangelischen Kirchen?","Zwei: Taufe und Abendmahl — weil nur diese beiden von Jesus selbst eingesetzt wurden."],
["b6","Was lehren Orthodoxe und Katholiken über die Eucharistie?","Dass Brot und Wein wirklich Leib und Blut Christi werden, nicht bloß ein Zeichen dafür sind."],
["b6","Wie verstehen reformatorische Kirchen das Abendmahl?","Unterschiedlich. Luther hält an der wirklichen Gegenwart Christi fest, reformierte Kirchen sprechen eher von geistlicher Gegenwart oder von einem Gedächtnismahl."],
["b6","Was ist die Myronsalbung?","Die Salbung mit geweihtem Öl, durch die der Heilige Geist geschenkt wird. Im Osten bekommt sie der Säugling direkt nach der Taufe, im Westen folgt sie später als Firmung."],
["b6","Was ist die Göttliche Liturgie?","Der Hauptgottesdienst der orthodoxen Kirche, fast immer in der Form, die auf Johannes Chrysostomos zurückgeht."],
["b6","Was ist eine Ikone?","Ein gemaltes Bild von Christus oder einem Heiligen. Verehrt wird es wie das Foto eines geliebten Menschen — angebetet wird nur Gott."],
["b6","Wie sieht die Fastenpraxis im Osten aus?","Feste Fastenzeiten, in denen auf tierische Produkte verzichtet wird. Die längste ist die Große Fastenzeit vor Ostern."],
["b6","Was meint Überlieferung oder Tradition?","Alles, was die Kirche weitergibt: Schrift, Gottesdienst, Konzilien, Väter. Im Osten gilt das nicht als Zusatz zur Bibel, sondern als ein Ganzes mit ihr."],

["b7","Was geschieht an Pfingsten in Apostelgeschichte 2?","Die Apostel fangen an zu reden, und jeder Zuhörer hört seine eigene Muttersprache. Der Text zählt die Herkunftsländer der Zuhörer einzeln auf."],
["b7","Welche Art von Sprache ist in Apostelgeschichte 2 gemeint?","Echte, verständliche Sprachen. Fremde aus anderen Ländern erkennen ihre eigene darin wieder."],
["b7", "Wo regelt Paulus die Zungenrede?", "Im 1. Korintherbrief, Kapitel 12 bis 14."],
["b7","Welche Bedingungen nennt Paulus in 1 Kor 14,27–28?","So jemand mit Zungen redet, so seien es ihrer zwei oder aufs meiste drei, und einer um den andern; und einer lege es aus. Ist aber kein Ausleger da, so schweige er in der Gemeinde, rede aber sich selber und Gott."],
["b7","Was zieht Paulus der Zungenrede vor?","Die Prophetie, weil sie die Gemeinde aufbaut. Lieber fünf Worte, die alle verstehen, als zehntausend, die keiner versteht."],
["b7", "Wofür ist die Zungenrede laut Paulus ein Zeichen?", "Darum sind die Zungen zum Zeichen nicht den Gläubigen, sondern den Ungläubigen; die Weissagung aber nicht den Ungläubigen, sondern den Gläubigen."],
["b7","Wie liest Johannes Chrysostomos die Kapitel über die Zungenrede (1 Kor 12–14)?","Er nennt den Abschnitt dunkel. Zu seiner Zeit, im 4. Jahrhundert, kam das Phänomen nicht mehr vor, und man wusste nicht mehr genau, wie es ausgesehen hatte."],
["b7","Was besagt die zessationistische Position?","Dass die außergewöhnlichen Gaben nur zur Gründungszeit der Kirche gehörten und mit den Aposteln aufhörten. „Zessation“ heisst Aufhören."],
["b7","Was besagt die kontinuationistische Position?","Dass Gott diese Gaben nie zurückgenommen hat und sie bis heute wirken. „Kontinuation“ heisst Fortdauer."],
["b7", "Wann entsteht die moderne Pfingstbewegung?", "1901 bei Charles Parham in Topeka, der Durchbruch 1906 in der Azusa Street in Los Angeles."],
["b7","Worin unterscheidet sich die heutige Praxis vom Bericht in Apostelgeschichte 2?","In Apostelgeschichte 2 sind es bekannte Sprachen, die Fremde verstehen. Was heute in vielen Gemeinden praktiziert wird, lässt sich meist keiner Sprache zuordnen."],
["b7","Was ist die Gabe der Unterscheidung der Geister?","Die Fähigkeit zu erkennen, was wirklich von Gott kommt und was nicht. Sie steht als eigene Gabe in 1 Kor 12,10, und der erste Johannesbrief verlangt ausdrücklich, das zu prüfen."],
["b7","Wie geht die orthodoxe Tradition mit geistlichen Erfahrungen um?","Nüchtern. Geprüft wird an den Früchten, am Gehorsam und am Urteil der Kirche. Wer die eigene Erfahrung selbst zum Maßstab macht, gerät in das, was der Osten „Prelest“ nennt: geistliche Selbsttäuschung."],
["b7", "Kennt die orthodoxe Liturgie Zungenrede?", "Nein — sie kommt in den liturgischen Ordnungen des Ostens nicht vor."],
["b7","Was sagt Jesus in Matthäus 6,7 über das Beten?","Und wenn ihr betet, sollt ihr nicht viel plappern wie die Heiden; denn sie meinen, sie werden erhört, wenn sie viel Worte machen."],
["b7","Welches Kapitel steht im 1. Korintherbrief zwischen den Kapiteln 12 und 14 über die Geistesgaben?","1 Korinther 13, das Kapitel über die Liebe. Ohne sie, schreibt Paulus, ist alles Reden nur Lärm."],
["b7", "Wie fragt Paulus in 1 Kor 12,30?", "Haben sie alle Gaben, gesund zu machen? Reden sie alle mancherlei Sprachen? Können sie alle auslegen?"],
["b7", "An welcher Stelle steht die Zungenrede in der Liste von 1 Kor 12,28?", "Und Gott hat gesetzt in der Gemeinde aufs erste die Apostel, aufs andre die Propheten, aufs dritte die Lehrer, darnach die Wundertäter, darnach die Gaben, gesund zu machen, Helfer, Regierer, mancherlei Sprachen."],
["b7","Woran misst Paulus eine echte Gabe?","Daran, ob sie die Gemeinde aufbaut, ob Ordnung bleibt und ob Liebe da ist. Nicht daran, wie stark sich das Erlebnis anfühlt."],
["b7","Was lehren die asketischen Väter über außergewöhnliche Gaben?","Dass Gaben erst der inneren Reinigung folgen und nie gesucht werden sollen. Johannes Klimakos warnt ausdrücklich davor, Zeichen haben zu wollen."],
["b7", "Was ist Prelest genau?", "Geistliche Selbsttäuschung: man hält eigene Eingebungen für Gnade. Gegenmittel sind Nüchternheit, Beichte und geistliche Führung."],
["b7", "Sind sich die Ausleger einig, dass 1 Kor 14 dasselbe meint wie Apostelgeschichte 2?", "Nein. Die einen sehen auch dort bekannte Sprachen, die anderen eine andere Erscheinungsform — anders als Apg 2 nennt 1 Kor 14 keine Völker."],
["b8", "Wohin schickt Jesus den Beter in Matthäus 6,6?", "Wenn aber du betest, so gehe in dein Kämmerlein und schließ die Tür zu und bete zu deinem Vater im Verborgenen; und dein Vater, der in das Verborgene sieht, wird dir's vergelten öffentlich."],
["b8", "Womit begründet Jesus, dass viele Worte unnötig sind (Mt 6,8)?", "Darum sollt ihr euch ihnen nicht gleichstellen. Euer Vater weiß, was ihr bedürfet, ehe ihr ihn bittet."],
["b8", "Was erlebt Elija am Horeb (1 Kön 19,11–12)?", "Er sprach: Gehe heraus und tritt auf den Berg vor den HERRN! Und siehe, der HERR ging vorüber und ein großer, starker Wind, der die Berge zerriß und die Felsen zerbrach, vor dem HERRN her; der HERR war aber nicht im Winde. Nach dem Winde aber kam ein Erdbeben; aber der HERR war nicht im Erdbeben. Und nach dem Erdbeben kam ein Feuer; aber der HERR war nicht im Feuer. Und nach dem Feuer kam ein stilles, sanftes Sausen."],
["b8", "Was sagt Psalm 46,11?", "Seid stille und erkennet, daß ich GOTT bin. Ich will Ehre einlegen unter den Heiden; ich will Ehre einlegen auf Erden."],
["b8","Was heißt Hesychia?","Stille — innere Ruhe, in der das Gebet überhaupt erst wachsen kann. Nicht nur Schweigen nach außen, sondern Ruhe im Kopf."],
["b8", "Wie lautet das Jesusgebet?", "Herr Jesus Christus, Sohn Gottes, erbarme dich meiner, des Sünders."],
["b8", "Warum ist das Jesusgebet so kurz?", "Wenige Worte, oft wiederholt, sammeln die Aufmerksamkeit. Es geht um Beständigkeit, nicht um Menge."],
["b8","Was ist die Philokalia?","Eine Sammlung von Texten der Kirchenväter über Aufmerksamkeit und inneres Gebet, erstmals 1782 in Venedig gedruckt."],
["b8","Was meint Nepsis im Gebet?","Wachsamkeit: die Aufmerksamkeit beim Gebet halten und den abschweifenden Gedanken nicht hinterherlaufen."],
["b8", "Was fordert Paulus in 1 Thessalonicher 5,17?", "Betet ohne Unterlaß."],
["b8","Was steht in Römer 8,26?","Desgleichen auch der Geist hilft unsrer Schwachheit auf. Denn wir wissen nicht, was wir beten sollen, wie sich's gebührt; sondern der Geist selbst vertritt uns aufs beste mit unaussprechlichem Seufzen."],
["b8", "Woran misst die Tradition ein gutes Gebet?", "An Reue, Aufmerksamkeit und Beständigkeit — nicht an Lautstärke, Dauer oder Gefühl."],
["b9", "Wo steht: Trachtet am ersten nach dem Reich Gottes?", "Matthäus 6,33 · Neues Testament"],
["b9", "Matthäus 6,33 — was steht dort?", "Trachtet am ersten nach dem Reich Gottes und nach seiner Gerechtigkeit, so wird euch solches alles zufallen."],
["b9", "Welcher Bibelvers hilft gegen Sorge?", "Philipper 4,6 — Sorget nichts! sondern in allen Dingen lasset eure Bitten im Gebet und Flehen mit Danksagung vor Gott kund werden."],
["b9", "Welcher Bibelvers hilft gegen Angst?", "Josua 1,9 — Siehe, ich habe dir geboten, daß du getrost und freudig seist. Laß dir nicht grauen und entsetze dich nicht; denn der HERR, dein Gott, ist mit dir in allem, was du tun wirst."],
["b9", "Welcher Bibelvers spricht über die Arbeit?", "Kolosser 3,23 — Alles, was ihr tut, das tut von Herzen als dem HERRN und nicht den Menschen."],
["b9", "Welcher Bibelvers spricht über die Versorgung der Familie?", "1 Timotheus 5,8 — So aber jemand die Seinen, sonderlich seine Hausgenossen, nicht versorgt, der hat den Glauben verleugnet und ist ärger denn ein Heide."],
["b9", "Welcher Bibelvers spricht über Disziplin?", "1 Korinther 9,27 — sondern ich betäube meinen Leib und zähme ihn, daß ich nicht den andern predige, und selbst verwerflich werde."],
["b9", "Welcher Bibelvers hilft in der Versuchung?", "1 Korinther 10,13 — Es hat euch noch keine denn menschliche Versuchung betreten; aber Gott ist getreu, der euch nicht läßt versuchen über euer Vermögen, sondern macht, daß die Versuchung so ein Ende gewinne, daß ihr's könnet ertragen."],
["b9", "Welcher Bibelvers spricht über Vergebung?", "Epheser 4,32 — Seid aber untereinander freundlich, herzlich und vergebet einer dem andern, gleichwie Gott euch auch vergeben hat in Christo."],
["b9", "Welcher Bibelvers hilft gegen Zorn?", "Jakobus 1,19 — Darum, liebe Brüder, ein jeglicher Mensch sei schnell, zu hören, langsam aber, zu reden, und langsam zum Zorn."],
["b9", "Welcher Bibelvers spricht über Demut?", "1 Petrus 5,5 — Desgleichen, ihr Jüngeren, seid untertan den Ältesten. Allesamt seid untereinander untertan und haltet fest an der Demut. Denn Gott widersteht den Hoffärtigen, aber den Demütigen gibt er Gnade."],
["b9", "Welcher Bibelvers spricht über Beständigkeit?", "Galater 6,9 — Lasset uns aber Gutes tun und nicht müde werden; denn zu seiner Zeit werden wir auch ernten ohne Aufhören."],
["b9", "Welcher Bibelvers spricht über Stärke in der Schwäche?", "2 Korinther 12,9 — Und er hat zu mir gesagt: Laß dir an meiner Gnade genügen; denn meine Kraft ist in den Schwachen mächtig. Darum will ich mich am allerliebsten rühmen meiner Schwachheit, auf daß die Kraft Christi bei mir wohne."],
["b9", "Welcher Bibelvers spricht über Führung?", "Sprüche 3,5–6 — Verlaß dich auf den HERRN von ganzem Herzen und verlaß dich nicht auf deinen Verstand; sondern gedenke an ihn in allen deinen Wegen, so wird er dich recht führen."],
["b9", "Welcher Bibelvers spricht über Reinheit?", "Psalm 119,9 — Wie wird ein Jüngling seinen Weg unsträflich gehen? Wenn er sich hält nach deinen Worten."],
["b9", "Welcher Bibelvers spricht davon, Gottes Wort im Herzen zu behalten?", "Psalm 119,11 — Ich behalte dein Wort in meinem Herzen, auf daß ich nicht wieder dich sündige."],
["b10", "Was ist der Kern von 1 Korinther 16,13?", "Wachet, stehet im Glauben, seid männlich und seid stark!"],
["b10", "Wo steht: Wachet, stehet im Glauben, seid männlich und seid stark?", "1 Korinther 16,13 · Neues Testament"],
["b10", "Was fordert Epheser 5,25 vom Mann?", "Ihr Männer, liebet eure Weiber, gleichwie Christus auch geliebt hat die Gemeinde und hat sich selbst für sie gegeben."],
["b10", "Was sagt 1 Petrus 3,7?", "Desgleichen, ihr Männer, wohnet bei ihnen mit Vernunft und gebet dem weiblichen als dem schwächeren Werkzeuge seine Ehre, als die auch Miterben sind der Gnade des Lebens, auf daß eure Gebete nicht verhindert werden."],
["b12", "Was beschreibt Sprüche 31?", "Die tüchtige Frau: Fleiß, Klugheit, Fürsorge, Würde — und Gottesfurcht als Maßstab."],
["b12", "Was steht in 1 Petrus 3,4?", "Sondern der verborgene Mensch des Herzens unverrückt mit sanftem und stillem Geiste; das ist köstlich vor Gott."],
["b12", "Was sagt Titus 2 über ältere und jüngere Frauen?", "Die älteren sollen die jüngeren anleiten — in Besonnenheit, Treue und Fürsorge."],
["b10", "Was verlangt 1 Timotheus 3 von einem Leiter?", "Untadelig, besonnen, gastfrei, nicht jähzornig, nicht geldgierig, das eigene Haus gut führend."],
["b10", "Was ist die Frucht des Geistes (Galater 5,22)?", "Die Frucht aber des Geistes ist Liebe, Freude, Friede, Geduld, Freundlichkeit, Gütigkeit, Glaube, Sanftmut, Keuschheit. Wider solche ist das Gesetz nicht."],
["b10", "Was sagt Matthäus 6,3–4 über Geben?", "Wenn du aber Almosen gibst, so laß deine linke Hand nicht wissen, was die rechte tut, auf daß dein Almosen verborgen sei; und dein Vater, der in das Verborgene sieht, wird dir's vergelten öffentlich."],
["b10", "Was sagt Jakobus 1,22?", "Seid aber Täter des Worts und nicht Hörer allein, wodurch ihr euch selbst betrügt."],
["b10", "Was sagt Micha 6,8?", "Es ist dir gesagt, Mensch, was gut ist und was der HERR von dir fordert, nämlich Gottes Wort halten und Liebe üben und demütig sein vor deinem Gott."],
["b10", "Was sagt 2 Timotheus 1,7?", "Denn Gott hat uns nicht gegeben den Geist der Furcht, sondern der Kraft und der Liebe und der Zucht."],
["b10", "Was sagt Matthäus 5,16?", "Also laßt euer Licht leuchten vor den Leuten, daß sie eure guten Werke sehen und euren Vater im Himmel preisen."],
["b10", "Was erklärt Josua 24,15 zur Führung im Haus?", "Gefällt es euch aber nicht, daß ihr dem HERRN dient, so erwählt euch heute, wem ihr dienen wollt: den Göttern, denen eure Väter gedient haben jenseit des Stroms, oder den Göttern der Amoriter, in deren Land ihr wohnt. Ich aber und mein Haus wollen dem HERRN dienen."],
["b10", "Wozu ruft 1 Timotheus 6,11 den Mann Gottes auf?", "Aber du, Gottesmensch, fliehe solches! Jage aber nach der Gerechtigkeit, der Gottseligkeit, dem Glauben, der Liebe, der Geduld, der Sanftmut."],
["b10", "Was sagt 1 Timotheus 5,8 über Versorgung?", "So aber jemand die Seinen, sonderlich seine Hausgenossen, nicht versorgt, der hat den Glauben verleugnet und ist ärger denn ein Heide."],
["b10", "Was sagt Sprüche 27,17?", "Ein Messer wetzt das andere und ein Mann den andern."],
["b12", "Was sagt Sprüche 31,30 über Schönheit?", "Lieblich und schön sein ist nichts; ein Weib, das den HERRN fürchtet, soll man loben."],
["b12", "Was antwortet Maria in Lukas 1,38?", "Maria aber sprach: Siehe ich bin des HERRN Magd; mir geschehe, wie du gesagt hast. Und der Engel schied von ihr."],
["b12", "Was sagt Rut 1,16 über Treue?", "Ruth antwortete: Rede mir nicht ein, daß ich dich verlassen sollte und von dir umkehren. Wo du hin gehst, da will ich auch hin gehen; wo du bleibst, da bleibe ich auch. Dein Volk ist mein Volk, und dein Gott ist mein Gott."],
["b12", "Woher kam der Glaube des Timotheus (2 Timotheus 1,5)?", "Und wenn ich mich erinnere des ungefärbten Glaubens in dir, welcher zuvor gewohnt hat in deiner Großmutter Lois und deiner Mutter Eunike; ich bin aber gewiß, auch in dir."],
["b12", "Was ist die Frucht des Geistes (Galater 5,22-23)?", "Die Frucht aber des Geistes ist Liebe, Freude, Friede, Geduld, Freundlichkeit, Gütigkeit, Glaube, Sanftmut, Keuschheit. Wider solche ist das Gesetz nicht."],
["b12", "Worauf soll der Sinn gerichtet sein (Philipper 4,8)?", "Weiter, liebe Brüder, was wahrhaftig ist, was ehrbar, was gerecht, was keusch, was lieblich, was wohllautet, ist etwa eine Tugend, ist etwa ein Lob, dem denket nach!"],
["b12", "Was zeigt Lukas 10,39-42 an Maria und Marta?", "Jesus aber antwortete und sprach zu ihr: Martha, Martha, du hast viel Sorge und Mühe; eins aber ist not. Maria hat das gute Teil erwählt; das soll nicht von ihr genommen werden. Andere Überlieferung: \"Martha, Martha, du hast Sorge und Mühe um vielerlei; aber nur weniges, ja nur \"eins\" ist not. Maria...\" usw."],
["b11", "Was verbietet Gott in 1. Mose 2,16–17?", "Und Gott der HERR gebot dem Menschen und sprach: Du sollst essen von allerlei Bäumen im Garten; aber von dem Baum der Erkenntnis des Guten und des Bösen sollst du nicht essen; denn welches Tages du davon ißt, wirst du des Todes sterben."],
["b11", "Was verspricht die Schlange in 1. Mose 3,5?", "Sondern Gott weiß, daß, welches Tages ihr davon eßt, so werden eure Augen aufgetan, und werdet sein wie Gott und wissen, was gut und böse ist."],
["b11", "Was geschieht nach dem Essen (1. Mose 3,7)?", "Da wurden ihrer beiden Augen aufgetan, und sie wurden gewahr, daß sie nackt waren, und flochten Feigenblätter zusammen und machten sich Schürze."],
["b11", "Was sagt Römer 2,15 über das Gewissen?", "Als die da beweisen, des Gesetzes Werk sei geschrieben in ihren Herzen, sintemal ihr Gewissen ihnen zeugt, dazu auch die Gedanken, die sich untereinander verklagen oder entschuldigen)."],
["b11", "Was sagt Hebräer 5,14?", "Den Vollkommenen aber gehört starke Speise, die durch Gewohnheit haben geübte Sinne zu unterscheiden Gutes und Böses."],
["b11", "Was ist laut 1 Timotheus 1,5 das Ziel der Unterweisung?", "Denn die Hauptsumme des Gebotes ist Liebe von reinem Herzen und von gutem Gewissen und von ungefärbtem Glauben."],
["b11", "Was sagt 1 Petrus 3,16?", "Und das mit Sanftmütigkeit und Furcht; und habt ein gutes Gewissen, auf daß die, so von euch afterreden als von Übeltätern, zu Schanden werden, daß sie geschmäht haben euren guten Wandel in Christo."],
["b11", "Was sagt Psalm 119,105?", "Dein Wort ist meine Fußes Leuchte und ein Licht auf meinem Wege."],
["b11", "Warum Verse auswendig lernen?", "Hebräer 4,12 — Denn das Wort Gottes ist lebendig und kräftig und schärfer denn kein zweischneidig Schwert, und dringt durch, bis daß es scheidet Seele und Geist, auch Mark und Bein, und ist ein Richter der Gedanken und Sinne des Herzens. Griffbereit ist es nur, wenn man es im Herzen trägt."],
["w", "Was ist Gesetzlichkeit — und was sagt Matthäus 23,23 dazu?", "Regeln ohne Barmherzigkeit. Matthäus 23,23 — Weh euch, Schriftgelehrte und Pharisäer, ihr Heuchler, die ihr verzehntet die Minze, Dill und Kümmel, und laßt dahinten das Schwerste im Gesetz, nämlich das Gericht, die Barmherzigkeit und den Glauben! Dies soll man tun und jenes nicht lassen."],
["w", "Warum darf man Bibelverse nicht aus dem Zusammenhang reissen?", "Ein Vers ohne Kapitel ist ein Zitat, kein Argument. Immer den Abschnitt mitlesen."],
["w", "Wovor warnt 1 Korinther 8,1 beim Wissen?", "1 Korinther 8,1 — Von dem Götzenopfer aber wissen wir; denn wir haben alle das Wissen. Das Wissen bläst auf, aber die Liebe bessert."],
["w", "Was sagt Jesus in Matthäus 7,3 über das Richten?", "Matthäus 7,3 — Was siehst du aber den Splitter in deines Bruders Auge, und wirst nicht gewahr des Balkens in deinem Auge?"],
["w", "Was sagt Jakobus 1,22 über Wissen ohne Tun?", "Jakobus 1,22 — Seid aber Täter des Worts und nicht Hörer allein, wodurch ihr euch selbst betrügt. Auswendig gelernte Verse sind noch kein Gehorsam."],
["w", "Wie soll man nach 2 Timotheus 2,23–24 mit Streitfragen umgehen?", "2 Timotheus 2,23–24 — Aber der törichten und unnützen Fragen entschlage dich; denn du weißt, daß sie nur Zank gebären. Ein Knecht aber des HERRN soll nicht zänkisch sein, sondern freundlich gegen jedermann, lehrhaft, der die Bösen tragen kann"],
["w", "Was lehrt Jesus in Matthäus 6 über Frömmigkeit vor anderen?", "Matthäus 6,1 und 6,16 — Almosen, Gebet und Fasten im Verborgenen."],
["w", "Warum soll man geistliche Erlebnisse nicht suchen?", "Wer geistliche Erlebnisse jagt, läuft in die Täuschung. Massstab sind Früchte, Gehorsam und das Urteil der Kirche."],
["w", "Was ist nach Matthäus 22,39 das zweite Gebot?", "Matthäus 22,39 — Das andere aber ist ihm gleich: \"Du sollst deinen Nächsten lieben wie dich selbst.\" Das zweite Gebot steht neben dem ersten, nicht darunter."]

["t1", "Was ist Margin?", "Die Sicherheitsleistung, nicht der Kaufpreis. Intraday verlangen Broker weniger als über Nacht."],
["t1", "Was ist Hebel wirklich?", "Das Verhältnis von Positionsgrösse zu Eigenkapital — er verstärkt Gewinn und Verlust exakt gleich."],
["t1", "Was ist der Spread?", "Der Abstand zwischen Geld- und Briefkurs. Du zahlst ihn bei jedem Einstieg mit."],
["t1", "Was ist Slippage?", "Die Differenz zwischen erwartetem und tatsächlichem Ausführungspreis — grösser bei News und dünnem Buch."],
["t1", "Was ist ein Round Turn?", "Kauf und Verkauf zusammen — danach rechnet man Kommission und Gebühren."],
["t1", "Wie unterscheiden sich die Handelszeiten?", "Forex 24 Stunden an 5 Tagen, Krypto 24/7, Aktien zu Börsenzeiten, Futures fast rund um die Uhr."],
["t1", "Was ist ein CFD und warum ist er anders?", "Ein Differenzkontrakt gegen den Broker, nicht an der Börse — deine Gegenpartei ist das Haus."],
["t2", "Was zeigt das Orderbuch?", "Die offenen Limitorders je Preis — Angebot und Nachfrage, die noch warten."],
["t2", "Unterschied Limit- und Market-Order?", "Limit wartet auf deinen Preis, Market nimmt den nächsten verfügbaren — sicher ausgeführt, aber mit Slippage."],
["t2", "Was macht ein Stop-Market-Auftrag?", "Er wird beim Auslösen zur Market-Order — Ausführung sicher, Preis nicht."],
["t2", "Was bedeutet Liquidität praktisch?", "Wie viel du bewegen kannst, ohne den Preis zu bewegen."],
["t2", "Was ist Volumen, was ist Delta?", "Volumen ist alles Gehandelte; Delta ist die Differenz zwischen aggressiven Käufen und Verkäufen."],
["t2", "Was meint Absorption?", "Aggressive Orders laufen gegen eine Limit-Wand — es wird viel gehandelt, der Preis bewegt sich kaum."],
["t2", "Was ist eine Imbalance im Orderflow?", "Deutliches Übergewicht einer Seite auf einem Preisniveau."],
["t2", "Was ist VWAP?", "Der volumengewichtete Durchschnittspreis — Orientierung für institutionelle Ausführung."],
["t2", "Was sind POC und Value Area?", "Der meistgehandelte Preis und die Zone, in der rund 70 Prozent des Volumens lagen."],
["t2", "Was meint Auktionslogik?", "Der Markt sucht Preise, an denen gehandelt wird; an den Rändern wird abgelehnt — daraus entstehen Trends und Ranges."],
["t3", "Wie definiert man einen Aufwärtstrend sauber?", "Höhere Hochs und höhere Tiefs — nachprüfbar, nicht Gefühl."],
["t3", "Was ist ein Strukturbruch?", "Das letzte relevante Tief wird unterboten beziehungsweise das letzte Hoch überboten."],
["t3", "Was ist eine Range?", "Preis pendelt zwischen zwei akzeptierten Grenzen — die meiste Zeit des Tages."],
["t3", "Breakout oder Fehlausbruch — woran erkennt man den Unterschied?", "Am Verhalten nach dem Bruch: Akzeptanz jenseits der Grenze oder schnelles Zurückfallen."],
["t3", "Was ist ein Pullback?", "Gegenbewegung innerhalb des Trends — der häufigste Einstiegstyp mit nahem Stop."],
["t3", "Warum liegen Stops oft über alten Hochs?", "Weil dort Liquidität liegt, die ein Markt zum Abarbeiten braucht."],
["t3", "Was meint Zeitrahmen-Hierarchie?", "Der grössere Zeitrahmen gibt die Richtung, der kleinere den Einstieg."],
["t3", "Wofür nutzt man ATR?", "Als Mass der durchschnittlichen Schwankung — für Stopabstand und realistische Ziele."],
["t3", "Was ist die Opening Range?", "Hoch und Tief der ersten Handelsminuten — Bezugspunkt für den restlichen Tag."],
["t3", "Warum sind runde Zahlen relevant?", "Weil dort Orders gebündelt liegen — nicht wegen Magie, sondern wegen Gewohnheit."],
["t4", "Was kennzeichnet Scalping?", "Sekunden bis Minuten, viele Trades, kleine Ziele — Kosten und Ausführung entscheiden."],
["t4", "Was kennzeichnet Daytrading?", "Minuten bis Stunden, Position wird vor Handelsschluss geschlossen — kein Overnight-Risiko."],
["t4", "Was kennzeichnet Swingtrading?", "Tage bis Wochen, weitere Stops, weniger Trades — man muss über Nacht aushalten können."],
["t4", "Was kennzeichnet Positionstrading?", "Wochen bis Monate, Entscheidung aus übergeordneter Struktur, Gebuehren fast irrelevant."],
["t4", "Welcher Stil frisst am meisten Zeit am Bildschirm?", "Scalping — und er reagiert am empfindlichsten auf Kosten und Slippage."],
["t4", "Welcher Stil passt bei wenig Zeit?", "Swing- oder Positionstrading, weil Entscheidungen seltener und planbarer sind."],
["t4", "Was ändert sich beim Wechsel vom Day- zum Swingtrading?", "Grössere Stops, kleinere Positionen, Overnight-Gaps und Zinskosten kommen dazu."],
["t4", "Warum ist Stilwechseln nach Verlusten gefährlich?", "Weil du jede Statistik über deinen Ansatz zerstörst, bevor sie aussagekräftig wird."],
["t5", "Was ist 1 R?", "Der Betrag, den du bei einem Trade riskierst — jede Bewertung läuft danach in R."],
["t5", "Wie lautet die Formel für die Positionsgrösse?", "Risiko in Geld geteilt durch Stopabstand mal Punktwert."],
["t5", "Beispiel: 500 Euro Risiko, 20 Punkte Stop im MNQ — wie viele Kontrakte?", "20 Punkte × 2 Dollar sind 40 Dollar pro Kontrakt, also rund 12 Kontrakte — aufrunden ist der klassische Fehler."],
["t5", "Was ist das Chance-Risiko-Verhältnis?", "Ziel geteilt durch Risiko — 2R heisst, du gewinnst doppelt so viel, wie du riskierst."],
["t5", "Wie rechnet man den Erwartungswert?", "Trefferquote × durchschnittlicher Gewinn minus Gegenwahrscheinlichkeit × durchschnittlicher Verlust."],
["t5", "Beispiel: 40 Prozent Trefferquote, 2R Gewinn, 1R Verlust — Erwartungswert?", "0,4 × 2 minus 0,6 × 1 ergibt plus 0,2 R pro Trade."],
["t5", "Warum ist eine hohe Trefferquote allein wertlos?", "Weil ein einziger grosser Verlust neunzig kleine Gewinne aufheben kann."],
["t5", "Was sagt die Drawdown-Mathematik?", "Minus 50 Prozent brauchen plus 100 Prozent zurück — Verluste wiegen überproportional."],
["t5", "Was ist Risk of Ruin?", "Die Wahrscheinlichkeit, das Konto zu verlieren — sie steigt stark mit der Risikogrösse pro Trade."],
["t5", "Warum ist Korrelation ein verstecktes Risiko?", "Weil fünf korrelierte Positionen in Wahrheit eine grosse Position sind."],
["t5", "Wozu dient ein Tagesverlustlimit?", "Es beendet den Tag, bevor der Tag dich beendet — typisch 2 bis 3 R."],
["t5", "Warum muss der Stop vor dem Einstieg stehen?", "Weil du ihn danach nicht mehr neutral setzen kannst — dann entscheidet die Position mit."],
["t6", "Was ist Regeltreue und warum ist sie die eigentliche Hürde?", "Den Plan auch dann ausführen, wenn er sich falsch anfühlt — daran scheitern die meisten, nicht an der Strategie."],
["t6", "Was ist Revenge Trading?", "Sofort nach einem Verlust zurückholen wollen — Positionsgrösse rauf, Regeln runter."],
["t6", "Was ist FOMO im Trading?", "Einsteigen, weil die Bewegung schon läuft — also genau dort, wo das Risiko am grössten ist."],
["t6", "Was ist Overtrading?", "Mehr Trades als der Plan vorsieht — meist aus Langeweile oder Druck."],
["t6", "Was bedeutet Prozess vor Ergebnis?", "Ein guter Trade kann verlieren, ein schlechter gewinnen — bewertet wird die Ausführung."],
["t6", "Was gehört in ein Journal?", "Aufbau, Einstieg, Stop, Ziel, Ausführung, Zustand — und ob du dich an die Regel gehalten hast."],
["t6", "Warum eine Checkliste vor dem Einstieg?", "Weil sie unter Druck die Entscheidung trägt, wenn das Urteil kippt."],
["t6", "Was ist Verlustaversion?", "Verluste wiegen psychisch etwa doppelt so schwer wie gleich grosse Gewinne — deshalb lässt man Verlierer laufen."],
["t6", "Warum nach drei Verlusten aufhören?", "Nicht wegen des Geldes, sondern weil die Urteilsfähigkeit messbar nachlässt."],
["t6", "Was ist der häufigste Selbstbetrug?", "Den Stop verschieben und es Flexibilität nennen."],
["t7", "Was fand die brasilianische Studie zu Daytradern?", "Von denen, die mindestens 300 Tage durchhielten, verloren 97 Prozent Geld."],
["t7", "Wie viele Daytrader verdienten in der brasilianischen Studie mehr als den Mindestlohn?", "1,1 Prozent dieser Gruppe — und 0,4 Prozent mehr als ein Bankangestellter."],
["t7", "Wurden die Daytrader in der brasilianischen Studie mit der Zeit besser?", "Keinen Lernfortschritt über die Zeit — länger dabei hiess nicht besser."],
["t7", "Was zeigen Daten aus Taiwan?", "Rund 20 Prozent der Daytrader waren nach Gebühren profitabel — ebenfalls eine Minderheit."],
["t7", "Wie funktioniert eine Prop-Firma?", "Du zahlst für eine Prüfung, handelst meist simuliert nach festen Regeln und bekommst bei Erfolg einen Anteil ausgezahlt."],
["t7", "Worauf muss man bei Prop-Firmen achten?", "Auf Verlustregeln, Konsistenzregeln, Auszahlungsbedingungen — und darauf, wie die Firma selbst verdient."],
["t7", "Unterschied Eigen- und Fremdkapital im Trading?", "Eigenes Geld bedeutet volles Risiko und volle Freiheit; fremdes Kapital bedeutet fremde Regeln und geteilten Gewinn."],
["t7", "Wie werden Trading-Gewinne versteuert?", "Das regelt jedes Land anders — kläre es vor dem ersten echten Trade mit einer Steuerberatung."],
["t7", "Warum täuschen Social-Media-Ergebnisse?", "Weil nur die Gewinner posten — die Verluste verschwinden still aus der Statistik."],
["t7", "Was ist der grösste Unterschied zwischen Demo und echt?", "Nicht der Markt, sondern du: dieselbe Regel fühlt sich mit echtem Geld anders an."],
["w", "Welche Gefahr droht nach drei Gewinnen in Folge?", "Drei Gewinne in Folge verführen zur grösseren Position — genau so gibt man die Serie zurück."],
["w", "Warum beweisen frühe Gewinne noch kein Können?", "Gewinne fühlen sich wie Können an. Erst nach hundert Trades weisst du, was Zufall war."],
["w", "Warum darfst du einen Stop nicht verschieben?", "Der häufigste Selbstbetrug. Ein verschobener Stop ist kein Plan mehr, sondern Hoffnung."],
["w", "Warum kein Geld nachschiessen, um einen Verlust zu heilen?", "Geld nachlegen, um einen Verlust zu heilen, verwandelt einen schlechten Tag in ein schlechtes Jahr."],
["w", "Warum solltest du die Strategie nicht schnell wechseln?", "Vor hundert Trades mit derselben Regel weisst du nichts über die Regel."],
["w", "Warum ist es gefährlich, den Selbstwert an Trades zu hängen?", "Wer sich über Trades definiert, kann nicht aussteigen, wenn es nötig ist."],
["w", "Welches Geld gehört nie ins Trading?", "Miete, Rücklagen, geliehenes Geld gehören nie ins Risiko. Nur was wirklich weg sein darf."],
["w", "Warum täuscht der Vergleich mit Tradern auf Social Media?", "Dort posten nur die Gewinner. Die Verlierer verschwinden still aus der Statistik."],
["w", "Warum bewertet man einen Trade am Prozess statt am Ergebnis?", "Ein gewonnener Regelbruch ist ein verlorener Trade — er trainiert genau das Falsche."]

let VOICES=[];
function vScore(v){
  const n=(v.name||"")+" "+(v.voiceURI||""), lang=(v.lang||"").toLowerCase();
  const want=(cfg().mic||"pt-BR").toLowerCase();
  let s=0;
  if(lang===want) s+=4;
  else if(lang.startsWith(want.split("-")[0])) s+=2;
  if(/premium|enhanced|neural|natural|siri|wavenet|studio/i.test(n)) s+=4;
  if(/compact|eloquence|espeak|pico/i.test(n)) s-=4;
  if(v.localService===false) s+=1;
  return s;
}
function voiceCode(){ return (cfg().mic||"pt-BR").split("-")[0].toLowerCase(); }
let VOICE_FB=null, VOICE_SET=null;   // gesetzt, wenn eine Ersatzsprache benutzt wird
const LANGNAME={pt:"Portugiesisch",es:"Spanisch",en:"Englisch",fr:"Franz\u00f6sisch",it:"Italienisch",
  ru:"Russisch",sr:"Serbisch",hr:"Kroatisch",bs:"Bosnisch",sl:"Slowenisch",uk:"Ukrainisch",bg:"Bulgarisch",
  el:"Griechisch",he:"Hebr\u00e4isch",ar:"Arabisch",de:"Deutsch",nl:"Niederl\u00e4ndisch",pl:"Polnisch",tr:"T\u00fcrkisch",sv:"Schwedisch",da:"D\u00e4nisch",nb:"Norwegisch",no:"Norwegisch",fi:"Finnisch",cs:"Tschechisch",sk:"Slowakisch",hu:"Ungarisch",ro:"Rum\u00e4nisch",ja:"Japanisch",ko:"Koreanisch",zh:"Chinesisch",th:"Thai",id:"Indonesisch",vi:"Vietnamesisch",hi:"Hindi",ca:"Katalanisch",fa:"Persisch"};
function loadVoices(){
  try{
    const all=(window.speechSynthesis?window.speechSynthesis.getVoices():[])||[];
    const code=voiceCode();
    const seen={};
    const forced=vlangOf();
    const chain=(forced?[forced]:[code].concat(cfg().fb||[])).filter((x,i,a)=>a.indexOf(x)===i);
    let list=[], used=null;
    for(const c of chain){
      const hit=all.filter(v=>(v.lang||"").toLowerCase().startsWith(c));
      if(hit.length){ list=hit; used=c; break; }
    }
    VOICE_FB = (used && used!==code) ? used : null;
    VOICE_SET = vlangOf()||null;
    VOICES=list.sort((a,b)=>vScore(b)-vScore(a))
      .filter(v=>{ const k=((v.name||"")+"|"+(v.lang||"")).toLowerCase(); if(seen[k]) return false; seen[k]=1; return true; });
  }catch(e){ VOICES=[]; }
}
function vlangOf(){ return (S.vlang||{})[S.rubrik]||""; }
function setVlang(c){
  S.vlang=S.vlang||{}; if(c) S.vlang[S.rubrik]=c; else delete S.vlang[S.rubrik];
  S.voices=S.voices||{}; delete S.voices[S.rubrik];
  save(); loadVoices(); voiceCard(); if(hasVoice()) speak(testLine());
}
function langList(){
  try{
    const all=(window.speechSynthesis?window.speechSynthesis.getVoices():[])||[];
    const m={}; all.forEach(v=>{ const c=(v.lang||"").toLowerCase().split("-")[0]; if(c) m[c]=(m[c]||0)+1; });
    return Object.keys(m).sort((a,b)=>(LANGNAME[a]||a).localeCompare(LANGNAME[b]||b)).map(c=>({c,n:m[c]}));
  }catch(e){ return []; }
}
function vLabel(v){
  const want=(cfg().mic||"").toLowerCase(), lang=(v.lang||"").toLowerCase();
  const mark = lang===want ? "" : lang.startsWith(want.split("-")[0]) ? " \u00b7 andere Variante" : " \u00b7 Ersatz";
  return `${vScore(v)>=7?"\u2605 ":""}${v.name} \u00b7 ${v.lang}${mark}`;
}
try{ loadVoices(); if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{ loadVoices(); voiceCard(); }; }catch(e){}
function pickVoice(){
  if(!VOICES.length) return null;
  const sel=(S.voices||{})[S.rubrik];
  return VOICES.find(v=>v.voiceURI===sel) || VOICES[0];
}
function hasVoice(){ return VOICES.length>0; }
function speakable(s){ return String(s).split(" \u00b7 ")[0]; }
function speak(txt){
  try{
    if(!window.speechSynthesis) return;
    const v=pickVoice();
    if(!v) return;
    txt=speakable(txt);
    const rate=S.rate||0.88;
    speechSynthesis.cancel();
    // In Teilstücke zerlegen: einzelne Satzteile klingen weniger monoton als ein langer Block
    const parts=String(txt).replace(/([,.;:!?])\s*/g,"$1|").split("|").filter(p=>p.trim());
    (parts.length?parts:[txt]).forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);
      u.lang=(v&&v.lang)||"pt-BR"; u.rate=rate; u.pitch=i?0.98:1.02;
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
const TESTLINE="Oi, tudo bem? Pode me levar pro centro, por favor? A gente vai marcar na sexta.";
function setVoice(uri){ S.voices=S.voices||{}; S.voices[S.rubrik]=uri; save(); voiceCard(); speak(testLine()); }
function testLine(){
  const pool=CHUNKS.filter(c=>c.pt && c.pt.length<70);
  if(!pool.length) return TESTLINE;
  return pool[Math.floor(Math.random()*pool.length)].pt.split(" \u00b7 ")[0];

function setRate(r){ S.rate=r; save(); voiceCard(); speak(testLine()); }

function langPick(){

    ${L.map(x=>`<option value="${x.c}" ${cur===x.c?"selected":""}>${LANGNAME[x.c]||x.c} \u00b7 ${x.n} ${x.n===1?"Stimme":"Stimmen"}</option>`).join("")}
  </select>`;
}

/* ---------------- Spracherkennung ---------------- */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function micOK(){ return !!SRC && S.mic!==false && !S.micBroken && !cfg().nomic; }
let REC=null, recBusy=false;
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function judge(heardList, target){
  const teile=String(target||"").split(" \u00b7 ");
  if(teile.length>1){ let best=null; for(const tt of teile){ const r=judge1(heardList, tt); if(!best||r.score>best.score) best=r; } return best; }
  return judge1(heardList, target);
}
function judge1(heardList, target){
  const t=norm(target);
  let best={v:"no", heard:heardList[0]||"", score:0};
  for(const raw of heardList){
    const hNorm=norm(raw);
    const d=lev(hNorm,t), sim=1-d/Math.max(t.length,1);
    let v = hNorm===t ? "ok" : sim>=0.82 ? "ok" : sim>=0.62 ? "near" : "no";
    if(sim>best.score){ best={v, heard:raw, score:sim}; }
    if(v==="ok") break;
  }
  return best;
}
function wordDiff(heard, target){
  target=String(target||"").split(" \u00b7 ")[0];
  const H=norm(heard).split(" "), T=target.split(" ");
  return T.map(w=>{
    const ok=H.includes(norm(w));
    return `<span style="color:${ok?"var(--accent)":"var(--bad)"}">${w}</span>`;
  }).join(" ");
}
function listen(target, onDone, statusId){
  if(!SRC) return onDone(null);
  try{
    if(REC) try{ REC.abort(); }catch(e){}
    REC=new SRC();
    REC.lang=cfg().mic; REC.interimResults=true; REC.maxAlternatives=4; REC.continuous=false;
    recBusy=true;
    const st=()=>document.getElementById(statusId||"micst");
    if(st()) st().textContent="H\u00f6re zu \u2026";
    let finals=[];
    REC.onresult=ev=>{
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        if(r.isFinal){ for(let k=0;k<r.length;k++) finals.push(r[k].transcript); }
        else if(st()) st().textContent="\u201e"+r[0].transcript+"\u201c";
      }
    };
    REC.onerror=e=>{
      recBusy=false;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){ S.micBroken=true; save(); }
      if(st()) st().textContent = e.error==="not-allowed"
        ? "Mikrofon nicht erlaubt \u2014 in den Einstellungen freigeben"
        : "Hat nicht geklappt ("+e.error+")";
      onDone(null, e.error);
    };
    REC.onend=()=>{
      recBusy=false;
      if(finals.length) onDone(judge(finals, target));
      else if(st() && st().textContent.indexOf("nicht erlaubt")<0) st().textContent="Nichts geh\u00f6rt \u2014 nochmal?";

/* ---------------- Prüfungsgespräch ---------------- */
const EX_OPEN=["Neuer Block","Weiter geht’s","Nächster Teil","Thema wechselt","Und jetzt"];
const EX_EXTRA=["Sag denselben Satz noch einmal, aber höflicher.","Sag ihn kürzer, in drei Wörtern wenn möglich.","Stell daraus eine Frage.","Antworte so, als hättest du es eilig.","Sag es noch einmal, ohne nachzudenken."];
let E=null;
function examStart(min){
  const perMin=4, want=min*perMin;
  const cats=shuffle(SCN.filter(s=>CHUNKS.some(c=>c.scn===s.id)));
  const plan=[];
  let left=want;
  cats.forEach((s,bi)=>{
    const pool=shuffle(CHUNKS.filter(c=>c.scn===s.id));
    const take=Math.max(2, Math.min(pool.length, Math.round(want/cats.length)));
    if(left<=0) return;
    plan.push({type:"block", name:s.name, icon:s.icon, cat:s.id});
    pool.slice(0,take).forEach((c,k)=>{
      plan.push({type:"item", c, cat:s.id});
      if(k===1 && Math.random()<0.5) plan.push({type:"extra", cat:s.id, txt:EX_EXTRA[Math.floor(Math.random()*EX_EXTRA.length)]});
      left--;
    });
    if(bi%2===1 && TOPICS.length) plan.push({type:"free", topic:TOPICS[Math.floor(Math.random()*TOPICS.length)]});
  });
  E={plan, i:0, min, res:{}, t0:Date.now()};
  examCard();
}
function examNote(cat, ok){
  E.res[cat]=E.res[cat]||{ok:0,n:0};
  E.res[cat].n++; if(ok) E.res[cat].ok++;
}
function examCard(){
  if(E.i>=E.plan.length) return examDone();
  const st=E.plan[E.i];
  const mins=Math.floor((Date.now()-E.t0)/60000), secs=Math.floor((Date.now()-E.t0)/1000)%60;
  const head=`<div class="meta"><span>Gespräch · ${mins}:${String(secs).padStart(2,"0")}</span><span>${E.i+1} / ${E.plan.length}</span></div>`;
  if(st.type==="block"){
    render(`<button class="back" onclick="home()">‹ abbrechen</button>${head}
    <div class="card" style="margin-top:10px">
      <p class="sub">${EX_OPEN[Math.floor(Math.random()*EX_OPEN.length)]}</p>
      <p class="prompt">${st.icon||""} ${st.name}</p>
      <button class="btn" onclick="examNext()">Los</button>
    </div>`);
    return;
  }
  if(st.type==="free"){
    render(`<button class="back" onclick="home()">‹ abbrechen</button>${head}
    <div class="card" style="margin-top:10px">
      <p class="sub">Frei sprechen · 30 Sekunden</p>
      <p class="prompt">${st.topic.t}</p>
      <p class="note">${(st.topic.hints||[]).join(" · ")}</p>
      <button class="btn" onclick="examNext()">Fertig</button>
    </div>`);
    return;
  }
  if(st.type==="extra"){
    render(`<button class="back" onclick="home()">‹ abbrechen</button>${head}
    <div class="card" style="margin-top:10px">
      <p class="sub">Zusatz</p>
      <p class="prompt">${st.txt}</p>
      <button class="btn" onclick="examNext()">Gesagt</button>
    </div>`);
    return;
  }
  const c=st.c;
  render(`<button class="back" onclick="home()">‹ abbrechen</button>${head}
  <div class="card" style="margin-top:10px">
    <p class="sub">${cfg().say}</p>
    ${katTag(c)}<p class="prompt">${c.de}</p>
    <div class="bar" id="bar"><i></i></div>
    ${micOK()?`<button class="btn" onclick="examMic()">🎤 Antwort sprechen</button>
      <p class="note" id="micst" style="text-align:center;margin-top:8px">Antippen, dann laut sagen</p>
      <button class="btn ghost sm" onclick="examReveal()">Ohne Mikro</button>`
    :`<button class="btn" onclick="examReveal()">Gesagt</button>`}
  </div>`);
  countdown(6000);
}
function examMic(){ const c=E.plan[E.i].c; clearInterval(timer); listen(c.pt, r=>{ if(r) examReveal(r); }); }
function examReveal(res){
  clearInterval(timer);
  const st=E.plan[E.i], c=st.c;
  S.said++; save();
  render(`<div class="meta"><span>Gespräch</span><span>${E.i+1} / ${E.plan.length}</span></div>
  <div class="card" style="margin-top:10px">
    <p class="sub">${c.de}</p>
    <p class="answer">${res?wordDiff(res.heard,c.pt):c.pt}</p>
    ${res?`<p class="note">Gehört: „${res.heard}“</p>`:""}
    <div class="score">
      <button class="ok" onclick="examScore(1)">Saß</button>
      <button class="mid" onclick="examScore(0)">Gestockt</button>
      <button class="no" onclick="examScore(-1)">Nein</button>
    </div>
  </div>`);
}
function examScore(v){
  const st=E.plan[E.i], c=st.c;
  examNote(st.cat, v===1);
  if(v===1){ S.box[c.id]=Math.min(5,(S.box[c.id]||0)+1); clearError(c.id); }
  else { S.box[c.id]=0; logError(c.id,c.de,c.pt); }
  save(); examNext();
}
function examNext(){ E.i++; examCard(); }
function examDone(){
  const rows=Object.keys(E.res).map(k=>{
    const s=SCN.find(x=>x.id===k)||{name:k};
    const r=E.res[k], pct=r.n?Math.round(r.ok/r.n*100):0;
    return {id:k, name:s.name, icon:s.icon||"", pct, ok:r.ok, n:r.n};
  }).sort((a,b)=>a.pct-b.pct);
  const total=rows.reduce((a,r)=>a+r.ok,0), n=rows.reduce((a,r)=>a+r.n,0);
  const mins=Math.max(1,Math.round((Date.now()-E.t0)/60000));
  S.exams=S.exams||[]; S.exams.push({at:Date.now(), pct:n?Math.round(total/n*100):0, min:mins, rubrik:S.rubrik}); save();
  const prev=S.exams.filter(x=>x.rubrik===S.rubrik); const before=prev.length>1?prev[prev.length-2]:null;
  render(`<div class="card"><h2>Gespräch ausgewertet</h2>
  <p class="big">${n?Math.round(total/n*100):0}%</p>
  <p class="note" style="text-align:center">${total} von ${n} · ${mins} Minuten${before?` · vorher ${before.pct}%`:""}</p>
  </div>
  <h2>Deine Schwächen</h2>
  ${rows.map(r=>`<button class="tile" onclick="drillScn('${r.id}')">
    <span class="ic">${r.icon}</span><span>${r.name}<small>${r.ok}/${r.n} · ${r.pct}%</small></span><span class="chev">›</span></button>`).join("")}
  <p class="note">Oben steht, was am schlechtesten lief — tippe drauf und drill es direkt. Was du nicht konntest, steht jetzt in der Fehlerliste.</p>
  <button class="btn ghost" onclick="home()">Zurück</button>`);
}
function examMenu(){
  const last=(S.exams||[]).filter(x=>x.rubrik===S.rubrik).slice(-1)[0];
  render(`<button class="back" onclick="dlgMenu()">‹ zurück</button><h2>Sektionsprüfung</h2>
  <p class="note" style="margin-bottom:12px">Ein Durchgang quer durch alles, jedes Mal in anderer Reihenfolge und mit anderen Zusatzaufgaben. Am Ende siehst du, welcher Bereich am schwächsten war.</p>
  ${last?`<div class="card"><p class="sub">Letztes Gespräch</p><p style="margin:6px 0 0;font-weight:700">${last.pct}% · ${last.min} Min</p></div>`:""}
  ${[5,10,15].map(m=>`<button class="tile" onclick="examStart(${m})"><span class="ic">⏱️</span><span>${m} Minuten<small>etwa ${m*4} Aufgaben, gemischt</small></span><span class="chev">›</span></button>`).join("")}`);
}

function scnDone(id){
  const items=CHUNKS.filter(c=>c.scn===id);
  const ok=items.filter(c=>(S.box[c.id]||0)>=3).length;
  return items.length ? ok/items.length>=0.7 : true;
}
function steps(){
  const order=[...SCN].filter(s=>CHUNKS.some(c=>c.scn===s.id)).sort((a,b)=>(inFocus(b.id)?1:0)-(inFocus(a.id)?1:0));
  const L=[
   {t:"Startpunkt messen", s:"20 "+einh()+" ohne Hilfe", run:"levelTest('pre')", done:!!preR()},
  ];
  if(S.rubrik==="pt"){
    L.push({t:"Lesen: Schrift \u2192 Laut", s:"30 W\u00f6rter vorlesen \u00b7 max. 3 Fehler", run:"lesen()", done:!!(S.tests[1]&&S.tests[1].pass)});
    L.push({t:"Englisch-Hebel", s:"40 W\u00f6rter umrechnen \u00b7 30 richtig", run:"hebel()", done:!!(S.tests[2]&&S.tests[2].pass)});
  }
  order.forEach(s=>L.push({t:s.name, s:(inFocus(s.id)?"im Fokus \u00b7 ":"")+"70 % der "+einh()+" sitzen", run:`drillScn('${s.id}')`, done:scnDone(s.id)}));
  L.push({t:"Pr\u00fcfung 3 \u00b7 Abruf im Fokus", s:"20 Prompts \u00b7 16 richtig", run:"mix(20,4,3)", done:!!(S.tests[3]&&S.tests[3].pass)});
  if(Object.keys(MISSIONS).length) L.push({t:"Missionen spielen", s:"alle durchspielen", run:"missionList()", done:Object.keys(S.missDone||{}).length>=Object.keys(MISSIONS).length});
  L.push({t:"4/3/2 Monolog", s:"ein Thema, drei Runden", run:"f432List()", done:(S.f432Done||0)>=1});
  L.push({t:"Pr\u00fcfung 5 \u00b7 Mix unter Zeitdruck", s:"30 Prompts \u00b7 24 richtig", run:"mix(30,3,5)", done:!!(S.tests[5]&&S.tests[5].pass)});
  L.push({t:"Fehlerliste leer drillen", s:"nur noch deine Schwachstellen", run:"drillErrors()", done:S.errors.length===0&&!!preR()});
  L.push({t:"Gespr\u00e4ch", s:"frei reden, 10 Minuten", run:"dlgMenu()", done:(S.exams||[]).some(x=>x.rubrik===S.rubrik)});
  L.push({t:"Endtest", s:"dieselben 20 "+einh()+" wie am Start", run:"levelTest('post')", done:!!postR()});
  return L;
}

function strictView(){
  const L=steps(), idx=L.findIndex(x=>!x.done), doneN=L.filter(x=>x.done).length;
  return `
  <div class="card" style="padding:14px 16px">
    <p class="sub">Gef\u00fchrt \u00b7 Schritt ${Math.min(idx<0?L.length:idx+1,L.length)} von ${L.length}</p>
    <p style="margin:6px 0 2px;font-weight:700;font-size:16px">${idx<0?"Alles durch \u2014 stark.":L[idx].t}</p>
    <p class="note">${idx<0?"Du hast den ganzen Weg abgeschlossen.":L[idx].s}</p>
    ${idx<0?"":`<button class="btn" onclick="${L[idx].run}">Weiter</button>`}
    <button class="btn ghost sm" onclick="setModeHome('frei')">Zum freien Modus</button>
  </div>
  <h2>Der Weg</h2>
  ${L.map((x,i)=>{
    const open = x.done || i===idx;
    return `<button class="tile" ${open?`onclick="${x.run}"`:""} style="${open?"":"opacity:.4"};${i===idx?"border-color:var(--accent)":""}">

}

const GRP_IC={"Sprachen":"\ud83d\udde3\ufe0f","Sprachen der Schrift":"\ud83d\udcdc","Glaube":"\u26ea","Beruf & K\u00f6rper":"\ud83d\udcbc","Musik":"\ud83c\udfb9"};
function grpOpen(g){ S.grp=S.grp||{}; return S.grp[g]!==undefined ? S.grp[g] : (RUBRIKEN.find(r=>r.id===S.rubrik)||{}).g===g; }
function toggleGrp(g){ S.grp=S.grp||{}; S.grp[g]=!grpOpen(g); save(); rubriken(); }
function rubriken(){
  const ready=RUBRIKEN.filter(r=>r.ready), soon=RUBRIKEN.filter(r=>!r.ready);
  const info=r=>Object.assign({}, r, rubProg(r.id)||{pct:0,started:false,done:false,n:0});
  const all=ready.map(info);
  const done=all.filter(r=>r.done), run=all.filter(r=>r.started&&!r.done), neu=all.filter(r=>!r.started&&!r.done);
  const tile=(r,ing)=>`<button class="tile" onclick="setRubrik('${r.id}')" style="${S.rubrik===r.id?"border-color:var(--accent)":""}">
      <span class="ic">${r.icon}</span>
      <span>${r.t}<small>${ing?"":r.g+" \u00b7 "}${r.n} Eintr\u00e4ge</small></span>
      <span class="chev" style="margin-left:auto;text-align:right">${r.done?`<b class="done">fertig</b>`:r.started?`<b style="color:var(--accent)">${r.pct}%</b>`:"\u203a"}</span></button>`;
  const GROUPS=[];
  all.concat(soon.map(r=>Object.assign({}, r, {soon:true, pct:0, n:0}))).forEach(r=>{
    let g=GROUPS.find(x=>x.g===r.g); if(!g){ g={g:r.g, rows:[]}; GROUPS.push(g); }
    g.rows.push(r);
  });
  const soonTile=r=>`<button class="tile" style="opacity:.45"><span class="ic">${r.icon}</span><span>${r.t}<small>${r.d}</small></span><span class="chev">in Arbeit</span></button>`;
  render(`<button class="back" onclick="home()">‹ zurück</button><h2>Deine Sprints</h2>
  ${run.length?`<p class="sub" style="margin:14px 0 8px">Begonnen</p>${run.map(tile).join("")}`:""}
  ${done.length?`<p class="sub" style="margin:16px 0 8px">Abgeschlossen</p>${done.map(tile).join("")}`:""}
  <p class="sub" style="margin:${run.length||done.length?"22px":"14px"} 0 8px">Alle Rubriken</p>
  ${GROUPS.map(g=>{
    const open=grpOpen(g.g), fertig=g.rows.filter(r=>r.done).length, lauf=g.rows.filter(r=>r.started&&!r.done).length;
    const sub=[g.rows.length+(g.rows.length===1?" Rubrik":" Rubriken"), lauf?lauf+" begonnen":"", fertig?fertig+" fertig":""].filter(Boolean).join(" \u00b7 ");
    return `<div class="grpwrap${open?" open":""}">
      <button class="grph" onclick="toggleGrp('${g.g.replace(/'/g,"\\'")}')">
        <span class="gic">${GRP_IC[g.g]||"\ud83d\udcc1"}</span>
        <span class="gtx">${g.g}<small>${sub}</small></span>
        <span class="arr">${open?"\u2212":"+"}</span></button>
      ${open?`<div class="grpbody">${g.rows.map(r=>r.soon?soonTile(r):tile(r,1)).join("")}</div>`:""}
    </div>`;
  }).join("")}
  <p class="note" style="margin-top:14px">Prozent heisst: so viel der Einträge sitzt bereits. Ab 90 Prozent oder nach bestandenem Endtest gilt ein Sprint als fertig. Fortschritt wird pro Rubrik getrennt gezählt.</p>`);
}

  <button class="tile" onclick="ttsMenu()"><span class="ic">🎙️</span><span>Echte Stimmen<small>${(S.tts&&S.tts.aus)?"aus · Handystimme":"an · "+((S.tts&&S.tts.sex==="m")?"Männerstimme":"Frauenstimme")}</small></span><span class="chev">›</span></button>

  <div class="card">

         <p class="note" style="margin-top:8px">Gesichert sind Fortschritt, Fehlerliste und Prüfungen. Stimme und Richtung bleiben unberührt.</p>`:""}
    <p class="note" style="margin-top:12px">Auf den Home-Bildschirm: Link in Safari öffnen → Teilen → „Zum Home-Bildschirm". Startet dann ohne Browserleiste. Achtung: der Fortschritt dort ist ein eigener Speicher und beginnt bei null.</p>
  </div>
  `);

function toggleMic(){ S.mic = S.mic===false ? true : false; save(); settings(); }
function badge(n){ const t=S.tests[n]; if(!t) return ""; return `<small class="${t.pass?'done':'fail'}">${t.pass?"bestanden":"nicht bestanden"} \u00b7 ${t.score}</small>`; }

function go(where){
  if(where==="scn") return scnList();

  if(where==="f432") return f432List();
