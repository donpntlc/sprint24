name: Aufnahmen aktualisieren
on:
  push:
    branches: [main]
    paths-ignore: ['audio/**']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fehlende Aufnahmen erzeugen
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: swedencentral
        run: node tools/audio.js
      - name: Speichern
        run: |
          git config user.name "sprint24-bot"
          git config user.email "sprint24-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "Nichts Neues" || (git commit -m "Neue Aufnahmen" && git pull --rebase && git push)
